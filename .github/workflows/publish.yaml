name: Publish

# The half of a release that does the work. It is reusable so that what a release *is* — a signed
# tag, on the default branch, saying the version the packages say — is written once and cannot drift
# between the ways a release is started.
#
# npm's trusted publisher does NOT name this file. npm validates the OIDC token's `workflow_ref`,
# which is the workflow a run entered by, not the one the publishing job lives in: the name npm is
# configured with is `release.yaml`. Renaming *that* file stops every release until npm is told.
#
# The shape follows SLSA: the tag is verified where nothing can publish, publishing authenticates
# with an identity that outlives no run — there is no token here, and no secret to leak — and the
# provenance the registry recorded is read back afterwards, so a release that produced no
# attestation fails loudly instead of quietly.
#
# Adding a package takes one release that cannot come through here, because npm will not hold a
# trusted publisher for a name that does not exist yet. Three times now the answer has been a
# `bootstrap` input carrying a token for that one release and removed again afterwards; the history
# has the shape of it, and every package has a publisher of its own again. Publishing a new name by
# hand instead would leave a version no provenance covers — a statement is signed with this
# workflow's identity, and nothing on a laptop has one — which the `provenance` job below then fails
# the next release over.
#
# What those releases taught, for whoever adds the seventh package:
#
#   * A granular token needs **Packages and scopes**, not **Organizations**. The second grants the
#     org's membership and says nothing about publishing, and npm answers a token without rights
#     `404 Not Found` rather than `403` — so the log reads as though the package does not exist
#     rather than as though you may not touch it. That cost one release a failed attempt.
#   * npm answers `409 Failed to save packument` when a run publishes one brand-new package straight
#     after another. Wait for the first to settle and dispatch again.
#   * A release that stopped partway is resumed rather than restarted. A recursive publish skips what
#     is already up, and a version that failed to publish is not recorded — so nothing is burned by
#     dispatching it again, which is worth checking before you do.
#   * A token beside a trusted publisher does not override it. pnpm asks per package and falls back
#     per package: in the release that carried both, only the package without a publisher fell back.
#
# Either way it has to be pnpm and not npm that packs. Three packages describe what they ship through
# `publishConfig` — the `bin` of `upwind` and of `create-upwind`, and the adapter's `exports`, each
# naming `dist/` there and the TypeScript sources outside it — and pnpm is what folds those in as it
# packs. `npm publish` would upload manifests pointing at `.ts` files no installed copy can load.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, as it was signed (`v0.1.0`).
        required: true
        type: string
      dry-run:
        description: Verify and build, and do everything but upload.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  verify:
    # Trust in a release starts here, and this job holds no `id-token`: nothing it can be made to do
    # can publish anything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          # The tag object itself, and enough history to prove where the tag stands.
          fetch-depth: 0
      # For `node`, below, to be the version this repository is written for rather than whichever
      # one the runner image happens to carry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: The tag carries a signature from a key this repository names
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only a tag object can be signed. A lightweight tag is a name pointing at a commit, and
          # `verify-tag` on one says nothing at all — so refuse it by its type first.
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != tag ]; then
            echo "::error::${TAG} is not an annotated tag object, so it carries no signature"
            exit 1
          fi
          # The runner's keyring starts empty and ends holding exactly the keys this file names, so a
          # good signature over the tag is a signature by one of them and by nobody else.
          gpg --batch --quiet --import .github/release-signers.asc
          # Read into a variable rather than piped into `grep -q`: a quiet grep leaves the pipeline
          # the moment it matches, and under `pipefail` the SIGPIPE that gives the writer would fail
          # this step on the good signature it just found.
          status="$(git verify-tag --raw "${TAG}" 2>&1 || true)"
          printf '%s\n' "${status}"
          case "${status}" in
            *'[GNUPG:] GOODSIG'*) ;;
            *)
              echo "::error::${TAG} carries no good signature from a key in .github/release-signers.asc"
              exit 1
              ;;
          esac

      - name: The tag stands on the default branch
        env:
          TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          # A signature says who made the tag, not what it names. This says the tree being published
          # is one that went through the branch every change is reviewed on.
          git fetch --no-tags --quiet origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::${TAG} does not stand on ${DEFAULT_BRANCH}"
            exit 1
          fi

      # Asked here, where nothing has been published yet, and asked again in the draft job, which is
      # the one that has to tell a draft from a published release. A tag whose release has already
      # been told about is not a tag to release: immutability means there is nothing to add to it, and
      # finding that out before npm rather than after is the difference between a refused release and
      # a published one with nowhere to say so.
      - name: Nothing has published a release for this tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # stdout and stderr kept apart: merged, a warning `gh` decided to print on a *successful*
          # call would arrive glued to the answer, and `true` would stop matching `true`.
          said="$(mktemp)"
          if answer="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>"${said}")"; then
            case "${answer}" in
              false)
                echo "::error::${TAG} already has a *published* release, which immutability makes unchangeable"
                exit 1
                ;;
              true)
                # A draft from an earlier attempt, left publishable. Leaving it there means a person
                # could publish it — incomplete, and then immutable — while this run is still going.
                # Deleting it here would need `contents: write` in a job that is meant to hold none,
                # so the slate is cleared by hand instead.
                echo "::error::${TAG} has a draft release from an earlier attempt. Delete it (gh release delete ${TAG} --repo ${GITHUB_REPOSITORY} --yes) and run this again; a draft left standing can be published while this one works."
                exit 1
                ;;
              *)
                echo "::error::unexpected answer about whether ${TAG} has a release: ${answer}"
                exit 1
                ;;
            esac
          else
            case "$(cat "${said}")" in
              *'release not found'*) ;;
              *)
                echo "::error::could not tell whether ${TAG} has a release: $(cat "${said}")"
                exit 1
                ;;
            esac
          fi

      # This workflow cannot publish a name npm has never seen: a first publish needs a token, and
      # there is none here by design. Without this check the run would publish every package that does
      # have a trusted publisher and fail on the one that does not — a release half made, and the half
      # that landed cannot be taken back. Asked here, where nothing has been published yet.
      - name: Nothing is being published for the first time
        run: |
          set -euo pipefail
          # A budget for the whole step, not for each request. Per-request deadlines alone say
          # nothing about the total: multiply them by the attempts and by however many packages this
          # repository has grown to, and a registry that accepts connections and then says nothing
          # costs more than this job is allowed (`timeout-minutes` above), which kills the run with
          # GitHub's message instead of the one below. With a budget, the arithmetic does not depend
          # on the number of packages, and what a reader gets is the error that explains itself.
          #
          # The bound is the budget plus one request: an attempt that started a moment before the
          # deadline still gets its fifteen seconds, and nothing waits after that. A hundred and
          # thirty-five seconds against this job's five minutes, whatever the registry is doing.
          deadline=$((SECONDS + 120))
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./${manifest}').private === true")" = true ]; then
              continue
            fi
            name="$(node -p "require('./${manifest}').name")"
            # Two answers are answers — it is there, or it never was — and everything else is the
            # registry not saying. `-f` is left off so that 404 is one of the answers rather than an
            # error with a `curl: (22)` beside it; the timeouts are so that a host which accepts the
            # connection and then says nothing costs half a minute instead of this job's whole five;
            # and the retry is because one 500 on the way to a release should not be the end of it.
            code=000
            for attempt in 1 2 3; do
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                break
              fi
              # `|| true` and not `|| echo 000`: `-w` prints after completion, successful or not, so a
              # connection that never got a response has already said `000` and a second one would
              # make it `000000`. What the `||` is for is `set -e`, which would otherwise end the
              # loop on the first failure it is there to survive.
              code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 \
                "https://registry.npmjs.org/${name/\//%2f}" || true)"
              case "${code}" in
                200 | 404) break ;;
              esac
              # Not after the last one, and not once the budget is spent: in both cases there is no
              # next request for the wait to be spacing out from.
              if [ "${attempt}" != 3 ] && [ "${SECONDS}" -lt "${deadline}" ]; then
                sleep 5
              fi
            done
            case "${code}" in
              200) ;;
              404)
                echo "::error::${name} has never been published, and no release can publish it from here: npm holds no trusted publisher for a name that does not exist, so the first one needs a token. The shape that carries one is in this file's history — see the note at the top."
                exit 1
                ;;
              *)
                echo "::error::could not tell whether ${name} has ever been published (HTTP ${code})"
                exit 1
                ;;
            esac
          done

      - name: The tag says the version the packages say
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          published=0
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./${manifest}').private === true")" = true ]; then
              continue
            fi
            name="$(node -p "require('./${manifest}').name")"
            version="$(node -p "require('./${manifest}').version")"
            if [ "${version}" != "${expected}" ]; then
              echo "::error file=${manifest}::${name} is ${version}, but ${TAG} says ${expected}"
              exit 1
            fi
            echo "${name}@${version}"
            published=$((published + 1))
          done
          if [ "${published}" -eq 0 ]; then
            echo "::error::no publishable package under packages/"
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A second gate a person holds, and the `environment` claim npm can be configured to require.
    environment: release
    permissions:
      contents: read
      # The OIDC token, for two things at once: pnpm exchanges it with npm for a short-lived grant to
      # publish these packages, and signs the provenance statement with it through Sigstore. The
      # caller has to grant this as well — a reusable workflow gets no more than it was given.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # Deliberately no `registry-url`: it writes an `.npmrc` naming `NODE_AUTH_TOKEN`, and this
          # job has no token to name — what it publishes with, it is handed at the moment it asks.

      - run: pnpm install --frozen-lockfile

      # The same checks CI runs. A tag on the default branch was green there, but "was green" is not
      # "is green on this tree", and a release is the one place worth paying for the difference.
      - run: pnpm typecheck
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: pnpm format
      - run: pnpm knip
      # A patch that no longer applies to the Next.js being released against is a Function that runs
      # without a rewrite it needs, and the adapter's own build says nothing about it. Cheap, and here
      # rather than only in CI: a tag can be pushed before that run finishes, or after it is cancelled.
      - run: pnpm check:patches
      # And for the same reason: a `create-upwind` released with last version's agent rules writes
      # every new project an uncommitted change, which nothing downstream would catch.
      - run: pnpm check:agent-rules
      # CI runs this and the release did not, which made a release the less-checked of the two. The
      # deploy-mode hooks against a host that is not one: no credential, no network.
      - run: pnpm check:deploy-tests
      - run: pnpm build

      # Made here, and before the publish, for two reasons. The install above populated pnpm's store,
      # which is what lets a licence and an author resolve rather than coming out `NOASSERTION`; and a
      # document that cannot be made should stop a release that has not happened yet, not a draft of
      # one that has.
      #
      # `--prod` is the whole point: the production closure is what the published packages carry with
      # them (11 components), where the full workspace graph is 230, most of it the linters and the
      # bundlers that never leave this repository. The CycloneDX spec version is pinned so that a
      # change to pnpm's default cannot quietly ship a different schema than the one read here; SPDX
      # has no equivalent, and pnpm emits 2.3.
      - name: The bill of materials for what is about to be published
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/sbom"
          rm -rf "${out}" && mkdir -p "${out}"
          pnpm sbom --sbom-format cyclonedx --sbom-spec-version 1.7 --prod > "${out}/sbom.cyclonedx.json"
          pnpm sbom --sbom-format spdx --prod > "${out}/sbom.spdx.json"
          # pnpm writes the document to stdout and its progress to stderr, so anything that ever
          # crossed those wires would arrive as a file that is not JSON. Say so here rather than
          # attach it to a release nobody can change afterwards.
          #
          # In node rather than python because this is a script inside a YAML block: python would
          # read the indentation of this file as its own, and a later edit of one would be a syntax
          # error in the other.
          node -e '
            const read = (p) => JSON.parse(require("node:fs").readFileSync(p, "utf8"));
            const [cdx, spdx] = [read(process.argv[1]), read(process.argv[2])];
            const must = (ok, said) => { if (!ok) { console.error(said); process.exit(1); } };
            must(cdx.specVersion === "1.7", `CycloneDX says ${cdx.specVersion}, not 1.7`);
            must(spdx.spdxVersion === "SPDX-2.3", `SPDX says ${spdx.spdxVersion}, not SPDX-2.3`);
            must(cdx.components?.length, "CycloneDX names no components");
            must(spdx.packages?.length, "SPDX names no packages");
            console.log(`CycloneDX ${cdx.specVersion}: ${cdx.components.length} components`);
            console.log(`SPDX ${spdx.spdxVersion}: ${spdx.packages.length} packages`);
          ' "${out}/sbom.cyclonedx.json" "${out}/sbom.spdx.json"

      # Only the draft job reads this, and a dry run has no draft job. The step above still runs in
      # one, because "can the document be made" is a thing a rehearsal is for.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.dry-run }}
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          # Long enough for the draft job below to take them, and no longer: what they are for is the
          # release, and the release is where they end up.
          retention-days: 1

      # Asked in `verify` too, and asked again here on purpose. `verify` runs before the environment
      # gate above, and an approval can wait hours; what it was asked about can change while it waits,
      # if somebody tired of waiting makes the release by hand. This is the last step before the one
      # thing here that cannot be undone, which is where the answer has to still be true.
      - name: Still nothing has published a release for this tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          said="$(mktemp)"
          if answer="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>"${said}")"; then
            case "${answer}" in
              false)
                echo "::error::${TAG} has had a release published while this run waited; immutability makes it unchangeable, and publishing to npm now would leave nowhere to say so"
                exit 1
                ;;
              true)
                echo "::error::a draft release for ${TAG} appeared while this run waited; publishing now would leave it standing, publishable and incomplete, beside packages it does not describe"
                exit 1
                ;;
              *)
                echo "::error::unexpected answer about whether ${TAG} has a release: ${answer}"
                exit 1
                ;;
            esac
          else
            case "$(cat "${said}")" in
              *'release not found'*) ;;
              *)
                echo "::error::could not tell whether ${TAG} has a release: $(cat "${said}")"
                exit 1
                ;;
            esac
          fi

      - name: Publish
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # A prerelease must not become what `npm install` picks by default.
          case "${version}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          # `--access public`: a scoped package is restricted until it is said otherwise, and the
          # first publish of each is the one that decides.
          # `--provenance`: not left to the registry's own generation, so that a release that cannot
          # attest to itself fails here rather than landing unattested.
          # `--no-git-checks`: the tree is a tag, checked out detached, which those checks refuse.
          # `--ignore-scripts`: `pnpm build` above already ran what `prepack` would run — they are the
          # same command in every package that has one — so the only thing publishing them again would
          # add is package code running in a job that holds an `id-token`. The hook stays for whoever
          # packs by hand, where it is the safety net it was added to be.
          # No `--batch`: provenance is bound to one package, and a batch sends them together.
          set -- --access public --provenance --tag "${dist_tag}" --no-git-checks --ignore-scripts
          if [ "${DRY_RUN}" = true ]; then
            set -- "$@" --dry-run
          fi
          pnpm --recursive publish "$@"

  provenance:
    needs: publish
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    # Six packages, each given the ten minutes the comment below explains, and room to say so. The
    # read-back is serial, so this has to grow with the number of packages or a release that published
    # cleanly would be killed while verifying the last one — and the hundred and twenty `npm view`
    # calls and the checkout are on top of the sixty minutes the waiting alone can take.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      # For `npm` to be a version that reads a field out of a packument by name.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Read back rather than assumed: `--provenance` fails a publish that cannot attest, and this
      # says the attestation is also what the registry will hand an installer.
      - name: The registry holds a provenance attestation for every version published
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./${manifest}').private === true")" = true ]; then
              continue
            fi
            name="$(node -p "require('./${manifest}').name")"
            predicate=''
            # Give the registry time to agree with itself. It needs more than it sounds like: on the
            # first release, two of the three packages then published were readable at once and the third answered
            # 404 for its whole document for nine minutes — while its attestation endpoint was
            # already serving. So this waits ten, and the failure below means what it says.
            for _ in $(seq 20); do
              # `--prefer-online`: a cached packument from before the publish would read as a
              # release with no attestation, which is the one wrong answer this must not give.
              predicate="$(npm view --prefer-online "${name}@${version}" dist.attestations.provenance.predicateType 2>/dev/null || true)"
              if [ -n "${predicate}" ]; then
                break
              fi
              sleep 30
            done
            if [ -z "${predicate}" ]; then
              echo "::error::${name}@${version} has no provenance attestation"
              exit 1
            fi
            echo "${name}@${version}: ${predicate}"
          done

  draft:
    needs: provenance
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The one job here that writes anything. What it writes is a draft: a release nobody has
      # published yet, which is the only kind this repository can still change its mind about.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The documents the publish job made of the tree it published, rather than a second pair made
      # here of a tree installed again.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom

      # Releases are immutable here: once one is published, its notes and its files are what they
      # are. So a release a person did publish must never be touched — that branch refuses.
      #
      # A draft is replaced rather than refused, which is the opposite of what the two guards before
      # the publish do, and for a reason: they were asking whether something was standing that a
      # person could publish while the packages were going out. By the time this runs the packages
      # are out, this job is the one whose business is the draft, and anything it finds appeared
      # during the run.
      - name: Nothing has published a release for this tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `|| true` would read a rate limit or an expired token as "no release here", which is the
          # one answer that must not be guessed. Only the registry's own words for it count — and
          # stdout is read apart from stderr, so a warning printed beside a good answer is not read as
          # part of it.
          said="$(mktemp)"
          if answer="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>"${said}")"; then
            state="${answer}"
          else
            case "$(cat "${said}")" in
              *'release not found'*) state=none ;;
              *)
                echo "::error::could not tell whether ${TAG} has a release: $(cat "${said}")"
                exit 1
                ;;
            esac
          fi
          case "${state}" in
            true)
              # An earlier attempt at this same release. A draft holds nothing anyone can have read,
              # so it is replaced rather than added to, and the tag it names is left alone.
              echo "::notice::replacing the draft an earlier run left for ${TAG}"
              gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes
              ;;
            false)
              echo "::error::${TAG} already has a *published* release, which immutability makes unchangeable"
              exit 1
              ;;
            none)
              # No release for this tag, which is what a release expects to find.
              ;;
            *)
              # Three answers are understood and a fourth is not an answer. Falling through here
              # would be reading "I do not know" as "there is nothing there".
              echo "::error::unexpected answer about whether ${TAG} has a release: ${state}"
              exit 1
              ;;
          esac

      # The files attached are the ones npm is serving, fetched back and checked against the digest
      # npm publishes beside them — not a second packing of the same tree, which would be a different
      # file that only ought to be the same.
      - name: Collect the tarballs npm is serving
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          rm -rf "${RUNNER_TEMP}/assets" && mkdir -p "${RUNNER_TEMP}/assets"
          : > "${RUNNER_TEMP}/packages.tsv"
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./${manifest}').private === true")" = true ]; then
              continue
            fi
            name="$(node -p "require('./${manifest}').name")"
            curl -fsSL "https://registry.npmjs.org/${name/\//%2f}" -o "${RUNNER_TEMP}/packument.json"
            # One line, three fields: where the tarball is, the digest npm published beside it, and
            # what the attestation says it is. In node, and read back with `cut`, so that nothing here
            # depends on the indentation of this file surviving a later edit of it.
            meta="$(node -e '
              const dist = require(process.argv[1]).versions[process.argv[2]].dist;
              console.log([
                dist.tarball,
                dist.integrity ?? "-",
                dist.attestations?.provenance?.predicateType ?? "-",
              ].join(" "));
            ' "${RUNNER_TEMP}/packument.json" "${version}")"
            url="$(printf '%s' "${meta}" | cut -d' ' -f1)"
            integrity="$(printf '%s' "${meta}" | cut -d' ' -f2)"
            predicate="$(printf '%s' "${meta}" | cut -d' ' -f3)"
            # The provenance job proved every one of these attested, minutes ago. An edge that has the
            # version but not yet the attestation beside it would hand back a dash here, and the notes
            # below say in prose that each package is attested — so a dash would make them lie. Given a
            # moment to catch up, and then refused.
            for _ in 1 2 3 4 5 6; do
              if [ "${predicate}" != - ]; then
                break
              fi
              sleep 10
              # Both of these are allowed to fail, because the loop they are in exists to absorb a
              # registry that is not answering the same way twice. Under `set -e` an unguarded one
              # would end the job instead of trying again, which is the opposite of what it is for.
              if ! curl -fsSL "https://registry.npmjs.org/${name/\//%2f}" -o "${RUNNER_TEMP}/packument.json"; then
                continue
              fi
              predicate="$(node -e '
                const dist = require(process.argv[1]).versions[process.argv[2]].dist;
                console.log(dist.attestations?.provenance?.predicateType ?? "-");
              ' "${RUNNER_TEMP}/packument.json" "${version}" || echo -)"
            done
            if [ "${predicate}" = - ]; then
              echo "::error::${name}@${version}: the registry served this version without the attestation the provenance job read; a draft that said otherwise would be wrong"
              exit 1
            fi
            file="${RUNNER_TEMP}/assets/$(basename "${url}")"
            # A scoped and an unscoped package can share a tarball basename, and the second download
            # would quietly replace the first. Say so instead.
            if [ -e "${file}" ]; then
              echo "::error::${name}@${version} would overwrite $(basename "${file}"), already collected"
              exit 1
            fi
            curl -fsSL "${url}" -o "${file}"
            if [ "${integrity}" = - ]; then
              echo "::error::${name}@${version}: npm published no digest to check the tarball against"
              exit 1
            fi
            got="sha512-$(openssl dgst -sha512 -binary "${file}" | base64 -w0)"
            if [ "${got}" != "${integrity}" ]; then
              echo "::error::${name}@${version}: the tarball npm served does not match the digest npm published"
              exit 1
            fi
            printf '%s\t%s\t%s\n' "${name}" "${version}" "${predicate}" >> "${RUNNER_TEMP}/packages.tsv"
            echo "${name}@${version}: $(basename "${file}") matches ${integrity}"
          done

      - name: Draft the release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="${RUNNER_TEMP}/notes.md"
          {
            echo '## Packages'
            echo
            echo 'Published to npm, each with a provenance attestation the release verified before this'
            echo 'draft was made. Attached below are the tarballs npm is serving, and a bill of'
            echo 'materials for what they carry: `sbom.cyclonedx.json` (CycloneDX 1.7) and'
            echo '`sbom.spdx.json` (SPDX 2.3), both from `pnpm sbom --prod`, so they describe the'
            echo 'production dependency closure of this tag and not the tooling this repository builds'
            echo 'with. Their root component is the workspace itself.'
            echo
            while IFS=$'\t' read -r name pkg_version predicate; do
              printf -- '- [`%s@%s`](https://www.npmjs.com/package/%s/v/%s) — `%s`\n' \
                "${name}" "${pkg_version}" "${name}" "${pkg_version}" "${predicate}"
            done < "${RUNNER_TEMP}/packages.tsv"
            echo
            # GitHub's own changelog, asked for rather than left to `--generate-notes`, so that it
            # goes *below* what this release is and the whole body is settled before a person looks.
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" --jq .body
          } > "${notes}"

          # An unmatched glob stays a literal here, and `gh` would refuse it as a file it cannot
          # find. Count them instead, so the message names what is missing.
          for kind in 'assets/*.tgz' 'sbom/*.json'; do
            # shellcheck disable=SC2086
            set -- ${RUNNER_TEMP}/${kind}
            if [ ! -e "$1" ]; then
              echo "::error::nothing matched ${kind}, so the release would have had none of them to attach"
              exit 1
            fi
          done
          set -- "${TAG}" "${RUNNER_TEMP}"/assets/*.tgz "${RUNNER_TEMP}"/sbom/*.json
          set -- "$@" --repo "${GITHUB_REPOSITORY}" --draft --verify-tag --title "${TAG}" --notes-file "${notes}"
            # Everything before 1.0 is a prerelease here, and so is anything with a prerelease part.
            # Set on the draft rather than left to whoever publishes it: a release cannot be changed
            # once it is published, so a flag that waits on somebody remembering a checkbox is one
            # that will be wrong eventually, and wrong permanently.
            #
            # Not the same question as the dist-tag above, and deliberately not the same answer.
            # `0.3.0` is what `npm install` should give you — `latest` — while being a release this
            # repository has not called stable. Only a prerelease part holds a version back on npm.
            case "${version}" in
              0.* | *-*) set -- "$@" --prerelease ;;
            esac
          gh release create "$@"
          echo "::notice::a draft release for ${TAG} is ready; publishing it is a person's job"
