name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Type-aware linting of every package holds more than Node's default heap.
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: pnpm format
      - run: pnpm knip
      - run: pnpm build

  vocabulary:
    # These packages describe a Next.js build and the Function that serves it. They must not
    # describe the workings of any one host that runs them — not its control plane, not its
    # topology, not the applications it happens to host. This says so mechanically, because
    # prose is where such a thing arrives unnoticed and the history keeps it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No host's internals in the sources
        run: |
          if grep -rniE \
            'control plane|deployment run\b|the authority|shell inspector|dispatch namespace|Workers for Platforms|\bwnam\b|another tenant' \
            packages --include='*.ts' --include='*.md'; then
            echo '::error::the lines above describe a particular host; say what this code does instead'
            exit 1
          fi
