name: Native Node runtime

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'fixtures/next-native/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/native-runtime.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'fixtures/next-native/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/native-runtime.yaml'

permissions:
  contents: read

concurrency:
  group: native-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: Native transport (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real Node HTTP transport and task lifetime
        run: pnpm exec vitest run --config vitest.config.mts test/native
        working-directory: packages/runtime

  deployment:
    name: Relocated native deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build public packages and probe the Node-only artifact
        run: node packages/upwind/scripts/check-native.ts --out "$RUNNER_TEMP/native-runtime"
