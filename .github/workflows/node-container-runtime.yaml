name: Node Container runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: node-container-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-runtime:
    name: Linux Node Container runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify the Node runtime transport and lifetime
        run: >-
          pnpm exec vitest run --project runtime
          packages/runtime/test/external-rewrite-node.test.ts
          packages/runtime/test/node-bindings.test.ts
          packages/runtime/test/node-container-signals.test.ts
          packages/runtime/test/node-container.test.ts
          packages/runtime/test/node-fetch-response.test.ts
          packages/runtime/test/node-http-bridge.test.ts
          packages/runtime/test/node-http-headers.test.ts
          packages/runtime/test/node-lifetime.test.ts
          packages/runtime/test/node-oidc.test.ts
