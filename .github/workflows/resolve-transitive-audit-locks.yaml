name: Resolve canonical transitive security locks

on:
  push:
    branches: [fix/undici-audit-patches-20261024]

permissions:
  contents: read

concurrency:
  group: transitive-canonical-lock-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/undici-audit-patches-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspaceId: root
            workspace: '.'
          - workspaceId: web-site
            workspace: web-site
    env:
      COREPACK_ENABLE_AUTO_PIN: '0'
      DO_NOT_TRACK: '1'
      LOCK_WORKSPACE_ID: ${{ matrix.workspaceId }}
      LOCK_WORKSPACE: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - name: Resolve only the canonical lock and source-bound provenance
        shell: bash
        run: |
          node --input-type=module <<'NODE_SOURCE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { existsSync, lstatSync, mkdirSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          // CI-only canonical metadata resolution. Never run this generator on a workstation.
          const expected = {"repository":"arkorlab/upwind","branch":"fix/undici-audit-patches-20261024","base":"53e763920f80d8c32e3d8d5294158158a2698bd1","submodule":null,"workspaces":[{"id":"root","directory":"."},{"id":"web-site","directory":"web-site"}],"packages":[{"name":"undici","major":7,"floor":[7,30,1]}],"allowedHooks":[]};
          const expectedManager = 'pnpm@12.14.0+sha512.c18ba6d87993d3d164cb5e8948f32b2c06ee854487e06cd8d86781342fb3e5bb4634367034711e86802baa9c37bea906ce1929ad08d70884c97d801df13389a6';
          const command = ['install', '--lockfile-only', '--ignore-scripts', '--no-frozen-lockfile', '--reporter=append-only'];
          const env = process.env;
          const root = process.cwd();
          const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const requireValue = (valid, label) => { if (!valid) throw new Error('Canonical lock generation rejected: ' + label); };
          const git = (args, cwd = root) => execFileSync('git', args, { cwd, encoding: 'utf8', maxBuffer: 32 * 1024 * 1024 });
          const list = (args, cwd = root) => git(args, cwd).split('\0').filter(Boolean);

          requireValue(env.GITHUB_ACTIONS === 'true' && env.GITHUB_EVENT_NAME === 'push', 'event');
          requireValue(env.GITHUB_REPOSITORY === expected.repository, 'repository');
          requireValue(env.GITHUB_REF === 'refs/heads/' + expected.branch, 'branch');
          requireValue(/^[a-f\d]{40}$/u.test(env.GITHUB_SHA ?? ''), 'source SHA');
          requireValue(/^[1-9]\d*$/u.test(env.GITHUB_RUN_ID ?? '') && /^[1-9]\d*$/u.test(env.GITHUB_RUN_ATTEMPT ?? ''), 'run identity');
          requireValue(process.version === 'v24.22.1', 'Node version');
          requireValue(git(['rev-parse', 'HEAD']).trim() === env.GITHUB_SHA, 'checkout SHA');
          execFileSync('git', ['merge-base', '--is-ancestor', expected.base, 'HEAD']);
          requireValue(git(['status', '--porcelain', '--untracked-files=no']).trim() === '', 'clean initial checkout');
          const scope = expected.workspaces.find((item) => item.id === env.LOCK_WORKSPACE_ID && item.directory === env.LOCK_WORKSPACE);
          requireValue(scope !== undefined, 'workspace selection');
          const targetLock = scope.directory === '.' ? 'pnpm-lock.yaml' : scope.directory + '/pnpm-lock.yaml';

          function regularFile(cwd, relative) {
            requireValue(relative !== '' && !path.isAbsolute(relative) && !relative.includes('\\') && path.posix.normalize(relative) === relative && !relative.split('/').includes('..'), 'noncanonical input path');
            const parts = relative.split('/');
            let current = cwd;
            for (let index = 0; index < parts.length; index += 1) {
              current = path.join(current, parts[index]);
              const stat = lstatSync(current);
              requireValue(!stat.isSymbolicLink() && (index === parts.length - 1 ? stat.isFile() : stat.isDirectory()), 'nonregular input or ancestor');
            }
            requireValue(lstatSync(current).size <= 16 * 1024 * 1024, 'input size');
            return current;
          }
          function readBound(cwd, relative) { return readFileSync(regularFile(cwd, relative)); }
          function noUntracked(cwd) {
            requireValue(list(['ls-files', '--others', '--exclude-standard', '-z'], cwd).length === 0, 'unexpected untracked output');
            requireValue(list(['ls-files', '--others', '--ignored', '--exclude-standard', '-z'], cwd).length === 0, 'ignored output or node_modules');
          }
          requireValue(realpathSync(root) === root, 'canonical checkout root');
          requireValue(!existsSync(path.join(root, 'node_modules')), 'initial root node_modules');
          const packageJson = JSON.parse(readBound(root, 'package.json').toString('utf8'));
          requireValue(packageJson.packageManager === expectedManager, 'package manager declaration');
          const pnpmVersion = execFileSync('pnpm', ['--version'], { cwd: root, encoding: 'utf8' }).trim();
          requireValue(pnpmVersion === '12.14.0', 'pnpm version');
          const workspaceDirectory = scope.directory === '.' ? root : path.dirname(regularFile(root, scope.directory + '/pnpm-workspace.yaml'));
          requireValue(readBound(root, targetLock).byteLength > 0, 'initial lock');
          const rootSources = [{ directory: root, prefix: '' }];
          let sdkCommit = null;
          if (expected.submodule !== null) {
            requireValue(expected.submodule === 'upwind', 'submodule path');
            const sdkDirectory = path.join(root, expected.submodule);
            requireValue(lstatSync(sdkDirectory).isDirectory() && !lstatSync(sdkDirectory).isSymbolicLink(), 'submodule directory');
            sdkCommit = git(['rev-parse', 'HEAD'], sdkDirectory).trim();
            const gitlink = git(['ls-tree', 'HEAD', '--', expected.submodule]).trim().split(/\s+/u);
            requireValue(gitlink[0] === '160000' && gitlink[2] === sdkCommit, 'submodule SHA');
            requireValue(git(['status', '--porcelain', '--untracked-files=no'], sdkDirectory).trim() === '', 'clean submodule');
            rootSources.push({ directory: sdkDirectory, prefix: expected.submodule + '/' });
          }
          function isHook(name) { return /^\.?pnpmfile(?:\.|$)/u.test(path.posix.basename(name)); }
          function isInput(name) {
            const basename = path.posix.basename(name);
            return basename === 'package.json' || basename === 'pnpm-workspace.yaml' ||
              basename === 'pnpm-lock.yaml' || basename === '.npmrc' || basename === '.pnpmrc' ||
              basename === '.node-version' || basename === '.nvmrc' || basename === '.tool-versions' ||
              basename === 'mise.toml' || basename === '.prototools' || isHook(name) ||
              /(^|\/)patches\//u.test(name) || name.endsWith('.patch');
          }
          function inputs() {
            const rows = [];
            const reviewedHooks = [];
            let totalBytes = 0;
            for (const source of rootSources) {
              const names = list(['ls-files', '-z'], source.directory);
              requireValue(names.length <= 100000, 'source file inventory size');
              for (const name of names.filter(isInput).sort()) {
                const relative = source.prefix + name;
                if (relative === targetLock) continue;
                const bytes = readBound(source.directory, name);
                totalBytes += bytes.byteLength;
                requireValue(totalBytes <= 64 * 1024 * 1024 && rows.length < 10000, 'aggregate input size');
                const hash = digest(bytes);
                if (isHook(name)) {
                  requireValue(expected.allowedHooks.some((hook) => hook.path === relative && hook.sha256 === hash), 'unreviewed executable pnpm hook');
                  reviewedHooks.push({ path: relative, sha256: hash, behavior: 'reviewed pure readPackage Astro peer adjustment' });
                }
                if (path.posix.basename(name) === 'pnpm-workspace.yaml' || path.posix.basename(name) === '.npmrc' || path.posix.basename(name) === '.pnpmrc') {
                  requireValue(!/^\s*(?:global[-_]?pnpmfile|pnpmfile|configDependencies)\s*[:=]/imu.test(bytes.toString('utf8')), 'external executable pnpm configuration');
                }
                rows.push([relative, hash]);
              }
            }
            requireValue(reviewedHooks.length === expected.allowedHooks.length, 'reviewed hook inventory');
            return { rows: rows.sort((a, b) => a[0].localeCompare(b[0], 'en')), reviewedHooks };
          }
          for (const source of rootSources) noUntracked(source.directory);
          const initialInputs = inputs();
          const inputHash = digest(JSON.stringify(initialInputs.rows));
          // pnpm12 may prepend a separate package-manager lock document. Only the final
          // document is the project graph; earlier document bytes must remain unchanged.
          function lockDocuments(bytes) {
            const text = bytes.toString('utf8');
            requireValue(Buffer.from(text, 'utf8').equals(bytes) && !text.includes('\r') && !text.includes('\0') && !text.startsWith('\uFEFF'), 'canonical UTF-8 lock');
            const lines = text.split('\n');
            const starts = [0];
            for (let index = 0; index < lines.length; index += 1) {
              if (lines[index] === '---') {
                if (index !== 0) starts.push(index);
              } else {
                requireValue(!/^(?:---|\.\.\.)(?:\s|$)/u.test(lines[index]), 'unsupported YAML document marker');
              }
            }
            requireValue(starts.length >= 1 && starts.length <= 2, 'lock document count');
            let project = null;
            for (let index = 0; index < starts.length; index += 1) {
              const document = lines.slice(starts[index], starts[index + 1] ?? lines.length);
              const headers = document.flatMap((line, position) => /^lockfileVersion\s*:/u.test(line) ? [position] : []);
              const packages = document.flatMap((line, position) => /^packages\s*:/u.test(line) ? [position] : []);
              const snapshots = document.flatMap((line, position) => /^snapshots\s*:/u.test(line) ? [position] : []);
              const importers = document.flatMap((line, position) => /^importers\s*:/u.test(line) ? [position] : []);
              requireValue(headers.length === 1 && packages.length === 1 && snapshots.length === 1 && importers.length <= 1, 'ambiguous or missing lock sections');
              requireValue(/^lockfileVersion:/u.test(document[headers[0]]) && document[packages[0]] === 'packages:' && document[snapshots[0]] === 'snapshots:' && (importers.length === 0 || document[importers[0]] === 'importers:'), 'noncanonical lock section header');
              requireValue(headers[0] < packages[0] && packages[0] < snapshots[0], 'lock section order');
              if (index === starts.length - 1) {
                requireValue(importers.length === 1 && headers[0] < importers[0] && importers[0] < packages[0], 'final project importer section');
                project = { lines: document, packageStart: packages[0], snapshotStart: snapshots[0] };
              }
            }
            requireValue(project !== null, 'project document');
            const projectStart = starts[starts.length - 1];
            const managerPrefix = projectStart === 0 ? Buffer.alloc(0) : Buffer.from(lines.slice(0, projectStart).join('\n') + '\n', 'utf8');
            return { project, documentCount: starts.length, managerPrefix };
          }
          const before = readBound(root, targetLock);
          const beforeDocuments = lockDocuments(before);
          const startedAt = new Date().toISOString();

          // The only dependency command: lock/metadata resolution in this GitHub Actions job.
          // --ignore-scripts disables lifecycle scripts; an explicitly reviewed canonical hook remains allowed.
          execFileSync('pnpm', command, { cwd: workspaceDirectory, stdio: 'inherit' });

          const finalInputs = inputs();
          requireValue(digest(JSON.stringify(finalInputs.rows)) === inputHash, 'immutable dependency input changed');
          const changedPaths = list(['diff', '--name-only', '-z', 'HEAD', '--']);
          requireValue(changedPaths.every((name) => name === targetLock), 'unexpected tracked output');
          for (const source of rootSources) {
            noUntracked(source.directory);
            requireValue(!existsSync(path.join(source.directory, 'node_modules')), 'node_modules was created');
          }
          if (expected.submodule !== null) {
            requireValue(git(['status', '--porcelain', '--untracked-files=no'], rootSources[1].directory).trim() === '', 'submodule was changed');
            requireValue(git(['rev-parse', 'HEAD'], rootSources[1].directory).trim() === sdkCommit, 'submodule revision changed');
          }
          const after = readBound(root, targetLock);
          requireValue(after.byteLength > 0, 'empty output lock');
          const afterDocuments = lockDocuments(after);
          requireValue(afterDocuments.documentCount === beforeDocuments.documentCount && afterDocuments.managerPrefix.equals(beforeDocuments.managerPrefix), 'package-manager lock documents changed');

          // Read only the canonical package-resolution section; never infer integrity from snapshots.
          function fixedResolutions(project) {
            const { lines, packageStart: start, snapshotStart: end } = project;
            const packageRows = [];
            const seen = new Set();
            for (let index = start + 1; index < end; index += 1) {
              const match = /^  ['"]?(undici|fast-uri)@(\d+)\.(\d+)\.(\d+)['"]?:\s*$/u.exec(lines[index]);
              if (match === null) {
                requireValue(!/^  ['"]?(?:undici|fast-uri)@/u.test(lines[index]), 'unrecognized target package version');
                continue;
              }
              const [, name, majorText, minorText, patchText] = match;
              const policy = expected.packages.find((item) => item.name === name && item.major === Number(majorText));
              if (policy === undefined) continue;
              const version = majorText + '.' + minorText + '.' + patchText;
              requireValue(!seen.has(name + '@' + version), 'duplicate target package resolution');
              seen.add(name + '@' + version);
              const parts = [Number(majorText), Number(minorText), Number(patchText)];
              requireValue(parts[1] > policy.floor[1] || (parts[1] === policy.floor[1] && parts[2] >= policy.floor[2]), 'affected target version remains');
              let blockEnd = index + 1;
              while (blockEnd < end && !/^  \S/u.test(lines[blockEnd])) blockEnd += 1;
              const block = lines.slice(index + 1, blockEnd).join('\n');
              const integrities = [...block.matchAll(/\bintegrity:\s*(sha512-[A-Za-z0-9+/]+={0,2})/gu)];
              requireValue(integrities.length === 1, 'target integrity missing or ambiguous');
              const integrity = integrities[0][1];
              const base64 = integrity.slice('sha512-'.length);
              requireValue(Buffer.from(base64, 'base64').byteLength === 64 && Buffer.from(base64, 'base64').toString('base64') === base64, 'noncanonical target integrity');
              packageRows.push({ name, version, integrity });
            }
            for (const item of expected.packages) {
              requireValue(packageRows.some((row) => row.name === item.name && row.version === item.floor.join('.')), 'fixed target missing');
            }
            return packageRows.sort((a, b) => (a.name + '@' + a.version).localeCompare(b.name + '@' + b.version, 'en'));
          }
          const resolutions = fixedResolutions(afterDocuments.project);
          requireValue(typeof env.RUNNER_TEMP === 'string' && path.isAbsolute(env.RUNNER_TEMP), 'runner temporary directory');
          const destination = path.join(env.RUNNER_TEMP, 'transitive-canonical-lock-' + scope.id);
          mkdirSync(destination, { recursive: false, mode: 0o700 });
          writeFileSync(path.join(destination, 'pnpm-lock.yaml'), after, { flag: 'wx', mode: 0o600 });
          const provenance = {
            version: 1,
            kind: 'canonical-transitive-security-lock-generation',
            status: 'complete',
            repository: env.GITHUB_REPOSITORY,
            head: env.GITHUB_SHA,
            base: expected.base,
            sourceTree: git(['rev-parse', 'HEAD^{tree}']).trim(),
            sdkCommit,
            ref: env.GITHUB_REF,
            runId: env.GITHUB_RUN_ID,
            attempt: env.GITHUB_RUN_ATTEMPT,
            workspace: scope.directory,
            targetLock,
            nodeVersion: process.version,
            packageManager: expectedManager,
            pnpmVersion,
            command: ['pnpm', ...command],
            startedAt,
            finishedAt: new Date().toISOString(),
            beforeLockSha256: digest(before),
            afterLockSha256: digest(after),
            beforeLockBytes: before.byteLength,
            afterLockBytes: after.byteLength,
            lockDocumentCount: afterDocuments.documentCount,
            preservedManagerDocuments: {
              count: beforeDocuments.documentCount - 1,
              bytesBefore: beforeDocuments.managerPrefix.byteLength,
              bytesAfter: afterDocuments.managerPrefix.byteLength,
              sha256Before: digest(beforeDocuments.managerPrefix),
              sha256After: digest(afterDocuments.managerPrefix),
              byteIdentical: true,
            },
            inputHashes: initialInputs.rows,
            inputHashesSha256: inputHash,
            reviewedPnpmHookInputs: initialInputs.reviewedHooks,
            unreviewedPnpmHooksAllowed: false,
            changedPaths,
            fixedPackageResolutions: resolutions,
            fixedPackageIntegritySource: 'canonical pnpm lock resolved in this CI job; compare with primary registry integrity before adoption',
            dependencyLifecycleScriptsExecuted: false,
            testsBuildAuditExecuted: false,
            frozenInstallVerified: false,
          };
          const provenanceBytes = JSON.stringify(provenance, null, 2) + '\n';
          requireValue(Buffer.byteLength(provenanceBytes) <= 4 * 1024 * 1024, 'provenance size');
          writeFileSync(path.join(destination, 'provenance.json'), provenanceBytes, { flag: 'wx', mode: 0o600 });
          console.log(JSON.stringify({ status: 'complete', workspace: scope.directory, inputCount: initialInputs.rows.length, beforeLockSha256: digest(before), afterLockSha256: digest(after), resolvedTargets: resolutions.map((item) => item.name + '@' + item.version) }));
          NODE_SOURCE
      - name: Retain the exact lock and typed provenance after every guard passed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transitive-canonical-lock-${{ matrix.workspaceId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/transitive-canonical-lock-${{ matrix.workspaceId }}/pnpm-lock.yaml
            ${{ runner.temp }}/transitive-canonical-lock-${{ matrix.workspaceId }}/provenance.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7
