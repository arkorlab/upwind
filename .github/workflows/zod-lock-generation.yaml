name: Canonical Zod security lock

on:
  push:
    branches: [fix/schema-upper-bound-short-circuit]

permissions:
  contents: read

concurrency:
  group: zod-canonical-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/schema-upper-bound-short-circuit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_AUTO_PIN: '0'
      DO_NOT_TRACK: '1'
      LOCK_GENERATION_REPOSITORY: arkorlab/upwind
      LOCK_GENERATION_BRANCH: fix/schema-upper-bound-short-circuit
      LOCK_GENERATION_BASE_SHA: ed801276aa5351d488ae0493e2f518a9fb24b7c8
      LOCK_GENERATION_NODE: v24.22.0
      LOCK_GENERATION_SUBMODULE: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - name: Generate only the canonical lock and typed provenance
        shell: bash
        run: |
          node --input-type=module <<'NODE_SOURCE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { existsSync, lstatSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          // Authored CI-only template. Never execute this file on the local workstation.
          const env = process.env;
          const expectedManager = 'pnpm@12.14.0+sha512.c18ba6d87993d3d164cb5e8948f32b2c06ee854487e06cd8d86781342fb3e5bb4634367034711e86802baa9c37bea906ce1929ad08d70884c97d801df13389a6';
          const command = ['install', '--lockfile-only', '--ignore-scripts', '--no-frozen-lockfile', '--reporter=append-only'];
          const git = (args, cwd = process.cwd()) => execFileSync('git', args, { cwd, encoding: 'utf8' });
          const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const requireValue = (valid, label) => { if (!valid) throw new Error('Lock generation rejected: ' + label); };

          requireValue(env.GITHUB_ACTIONS === 'true' && env.GITHUB_EVENT_NAME === 'push', 'event');
          requireValue(env.GITHUB_REPOSITORY === env.LOCK_GENERATION_REPOSITORY, 'repository');
          requireValue(env.GITHUB_REF === 'refs/heads/' + env.LOCK_GENERATION_BRANCH, 'branch');
          requireValue(/^[a-f\d]{40}$/u.test(env.GITHUB_SHA ?? ''), 'source SHA');
          requireValue(/^[a-f\d]{40}$/u.test(env.LOCK_GENERATION_BASE_SHA ?? ''), 'base SHA');
          requireValue(/^[1-9]\d*$/u.test(env.GITHUB_RUN_ID ?? '') && /^[1-9]\d*$/u.test(env.GITHUB_RUN_ATTEMPT ?? ''), 'run identity');
          requireValue(process.version === env.LOCK_GENERATION_NODE, 'Node version');
          requireValue(git(['rev-parse', 'HEAD']).trim() === env.GITHUB_SHA, 'checkout SHA');
          execFileSync('git', ['merge-base', '--is-ancestor', env.LOCK_GENERATION_BASE_SHA, 'HEAD']);
          requireValue(git(['status', '--porcelain', '--untracked-files=no']).trim() === '', 'clean initial checkout');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          requireValue(pkg.packageManager === expectedManager, 'package manager declaration');
          const pnpmVersion = execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim();
          requireValue(pnpmVersion === '12.14.0', 'pnpm version');

          const root = process.cwd();
          const submodule = env.LOCK_GENERATION_SUBMODULE ?? '';
          let sdkCommit = null;
          if (submodule !== '') {
            requireValue(submodule === 'upwind', 'submodule path');
            sdkCommit = git(['rev-parse', 'HEAD'], path.join(root, submodule)).trim();
            const gitlink = git(['ls-tree', 'HEAD', '--', submodule]).trim().split(/\s+/u);
            requireValue(gitlink[0] === '160000' && gitlink[2] === sdkCommit, 'submodule SHA');
            requireValue(git(['status', '--porcelain', '--untracked-files=no'], path.join(root, submodule)).trim() === '', 'clean submodule');
          }

          function manifests(cwd, prefix) {
            return git(['ls-files', '-z'], cwd).split('\0').filter(Boolean).filter((name) =>
              (name === 'package.json' || name.endsWith('/package.json') ||
               name === 'pnpm-workspace.yaml' || name.endsWith('/pnpm-workspace.yaml') ||
               name.startsWith('.pnpmfile.') || name.includes('/.pnpmfile.') ||
               name.startsWith('patches/') || name.includes('/patches/') ||
               (name.endsWith('pnpm-lock.yaml') && (prefix !== '' || name !== 'pnpm-lock.yaml')))
            ).sort().map((name) => {
              const filename = path.join(cwd, name);
              requireValue(lstatSync(filename).isFile(), 'non-regular manifest input');
              return [prefix + name, digest(readFileSync(filename))];
            });
          }
          function inputs() {
            return [...manifests(root, ''), ...(submodule === '' ? [] : manifests(path.join(root, submodule), submodule + '/'))]
              .sort((a, b) => a[0].localeCompare(b[0], 'en'));
          }
          const inputHashes = inputs();
          const inputDigest = digest(JSON.stringify(inputHashes));
          const before = readFileSync('pnpm-lock.yaml');
          const beforeHash = digest(before);
          const startedAt = new Date().toISOString();
          requireValue(!existsSync(path.join(root, 'node_modules')), 'initial node_modules');
          if (submodule !== '') requireValue(!existsSync(path.join(root, submodule, 'node_modules')), 'initial submodule node_modules');

          // This is the only dependency command: metadata/lock resolution in CI, no package scripts.
          execFileSync('pnpm', command, { stdio: 'inherit' });

          requireValue(digest(JSON.stringify(inputs())) === inputDigest, 'manifest, patch, nested lock, or pnpm hook changed');
          const changed = git(['diff', '--name-only', '-z', 'HEAD', '--']).split('\0').filter(Boolean);
          requireValue(changed.every((name) => name === 'pnpm-lock.yaml'), 'unexpected tracked change');
          requireValue(!existsSync(path.join(root, 'node_modules')), 'node_modules was created');
          if (submodule !== '') {
            requireValue(git(['status', '--porcelain', '--untracked-files=no'], path.join(root, submodule)).trim() === '', 'submodule was changed');
            requireValue(!existsSync(path.join(root, submodule, 'node_modules')), 'submodule node_modules was created');
          }
          requireValue(lstatSync('pnpm-lock.yaml').isFile(), 'output lock is not regular');
          const after = readFileSync('pnpm-lock.yaml');
          requireValue(after.byteLength > 0 && after.byteLength <= 16 * 1024 * 1024, 'output lock size');
          requireValue(typeof env.RUNNER_TEMP === 'string' && path.isAbsolute(env.RUNNER_TEMP), 'runner temporary directory');
          const destination = path.join(env.RUNNER_TEMP, 'zod-canonical-lock');
          mkdirSync(destination, { recursive: false });
          writeFileSync(path.join(destination, 'pnpm-lock.yaml'), after, { flag: 'wx' });
          const provenance = {
            version: 1,
            kind: 'canonical-dependency-lock-generation',
            status: 'complete',
            repository: env.GITHUB_REPOSITORY,
            head: env.GITHUB_SHA,
            base: env.LOCK_GENERATION_BASE_SHA,
            sourceTree: git(['rev-parse', 'HEAD^{tree}']).trim(),
            sdkCommit,
            ref: env.GITHUB_REF,
            runId: env.GITHUB_RUN_ID,
            attempt: env.GITHUB_RUN_ATTEMPT,
            nodeVersion: process.version,
            pnpmVersion,
            command: ['pnpm', ...command],
            startedAt,
            finishedAt: new Date().toISOString(),
            beforeLockSha256: beforeHash,
            afterLockSha256: digest(after),
            outputLockBytes: after.byteLength,
            inputHashes,
            inputHashesSha256: inputDigest,
            changedPaths: changed,
            dependencyScriptsExecuted: false,
            testsBuildAuditExecuted: false,
            frozenInstallVerified: false,
          };
          writeFileSync(path.join(destination, 'provenance.json'), JSON.stringify(provenance, null, 2) + '\n', { flag: 'wx' });
          console.log(JSON.stringify({ status: provenance.status, beforeLockSha256: beforeHash, afterLockSha256: provenance.afterLockSha256, inputCount: inputHashes.length }));
          NODE_SOURCE
      - name: Retain the generated lock only after the source checks succeeded
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zod-canonical-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zod-canonical-lock/pnpm-lock.yaml
            ${{ runner.temp }}/zod-canonical-lock/provenance.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7
