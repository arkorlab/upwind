name: Independent public Pages handler profile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-pages-handler-profile.yaml'
      - 'tools/native-pages-handler-profile-ci.mts'
      - 'tools/native-pages-handler-profile/**'
      - 'packages/adapter/src/node-pages-handler-profile.ts'
      - 'packages/adapter/test/node-pages-handler-profile.test.ts'
      - 'packages/adapter/test/node-pages-handler-inputs.test.ts'

permissions:
  contents: read

concurrency:
  group: independent-pages-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce:
    # Ubuntu 24.04's Docker keeps the classic image store, where an image's ID is its config digest,
    # which the producer pins, runs and records (`IMAGE_ID`). `ubuntu-latest` became 26.04, whose
    # containerd store reports the index digest there instead, so no run got past its image check.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - server-minification: default
            option: ''
            output: independent-pages-handler-profile
            artifact: UNQUALIFIED-public-pages-handler
          - server-minification: off
            option: '--server-minification=off'
            output: independent-pages-handler-profile-server-minification-off
            artifact: UNQUALIFIED-public-pages-handler-server-minification-off
          - server-minification: default
            option: '--next=16.4.4'
            output: independent-pages-handler-profile-next-16.4.4
            artifact: UNQUALIFIED-public-pages-handler-next-16.4.4
          - server-minification: off
            option: '--next=16.4.4 --server-minification=off'
            output: independent-pages-handler-profile-next-16.4.4-server-minification-off
            artifact: UNQUALIFIED-public-pages-handler-next-16.4.4-server-minification-off
          - server-minification: default
            option: '--next=16.4.5'
            output: independent-pages-handler-profile-next-16.4.5
            artifact: UNQUALIFIED-public-pages-handler-next-16.4.5
          - server-minification: off
            option: '--next=16.4.5 --server-minification=off'
            output: independent-pages-handler-profile-next-16.4.5-server-minification-off
            artifact: UNQUALIFIED-public-pages-handler-next-16.4.5-server-minification-off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The producer's own pnpm, from its fixture: the repository's `packageManager` names another.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: tools/native-pages-handler-profile/fixture/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Independently compile fixed public inputs twice without network
        env:
          MATRIX_OPTION: ${{ matrix.option }}
        run: |
          set -euo pipefail
          read -r -a options <<< "$MATRIX_OPTION"
          node tools/native-pages-handler-profile-ci.mts "${options[@]}"
      - name: Retain unqualified public source corpus for separate review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.output }}/UNQUALIFIED.json
          if-no-files-found: error
          retention-days: 1
