<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>upwind</title>
  <!--
    A rising chevron: the mark is the word. The stroke follows the reader's colour scheme, because a
    browser draws a tab's icon on its own chrome and a fixed black one disappears into a dark one.
  -->
  <style>
    path { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) { path { stroke: #fafafa; } }
  </style>
  <path
    d="M4.5 22.5 16 9.5 27.5 22.5"
    fill="none"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
