name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Native Container startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start a real image through the local native namespace
        run: pnpm exec vitest run --project upwind packages/upwind/test/local-container-runtime.test.ts
        env:
          UPWIND_CONTAINER_INTEGRATION: '1'
  check-static:
    name: Typecheck and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # First, because two packages are read through the `dist` they are built into rather than
      # through their sources — `@stayingupwind/sdk` and `@stayingupwind/auth`, both of which an
      # *application's* bundler reads, and neither of which can therefore name `src` in `exports`.
      # A sibling that imports one of them resolves it to declarations that do not exist until this
      # has run, so everything type-aware below has to come after it. `pnpm -r` builds in dependency
      # order, so this is also what proves that order is right.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm knip
      # Every rewrite of Next.js's output still finds what it insists on, in the version this
      # repository builds against. The whole supported range, and the canary, are the
      # `next-matrix` workflow's: they cost a download per version.
      - run: pnpm check:patches
      # The agent rules `create-upwind` writes are still the ones Next.js writes. Text copied out of
      # another project goes stale without saying so, and this one is compared byte for byte.
      - run: pnpm check:agent-rules
      # The packages that serve and deploy a deployment say nothing of any one host
      # (`tools/vocabulary`): each mention is annotated on the line that makes it.
      - run: pnpm check:vocabulary --format github

  lint-shards:
    name: Lint (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [compiler-runtime, cache-local, remaining]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware linting reads the SDK and auth declarations emitted by the build.
      - run: pnpm build
      # These two prefixes and the complementary full-repository scan cover every lint target.
      # Keep the same typed config in each process, including imported types from other packages.
      - name: Lint compiler and runtime
        if: ${{ matrix.group == 'compiler-runtime' }}
        run: pnpm exec eslint packages/adapter packages/runtime --max-warnings 0
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Lint cache and local validation
        if: ${{ matrix.group == 'cache-local' }}
        run: pnpm exec eslint packages/cache packages/local --max-warnings 0
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Lint all remaining files
        if: ${{ matrix.group == 'remaining' }}
        run: >-
          pnpm lint
          --ignore-pattern 'packages/adapter/**'
          --ignore-pattern 'packages/runtime/**'
          --ignore-pattern 'packages/cache/**'
          --ignore-pattern 'packages/local/**'
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  lint:
    if: ${{ always() }}
    needs: [lint-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every lint partition
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  deploy-hook-contracts:
    name: Deploy hook contracts (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [host, environment, lifecycle-workspace, install-manager]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each runner owns its fixtures, fake hosts and deployment-claim directory.
      - run: pnpm check:deploy-tests --group "$CONTRACT_GROUP"
        env:
          CONTRACT_GROUP: ${{ matrix.group }}

  check-contracts:
    name: Local runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Native namespaces, SQLite storage, workflows and capability isolation, all local.
      - run: pnpm check:durable-objects
      - run: pnpm check:cloudflare-workflows
      - run: pnpm check:ai

  # Preserve the existing check name and require success from every independent gate.
  check:
    if: ${{ always() }}
    needs: [check-static, lint, check-contracts, deploy-hook-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep each project's environment and isolation; Vitest shards whole test files.
      - run: pnpm build
      - run: pnpm test --shard="$SHARD_INDEX/8"
        env:
          SHARD_INDEX: ${{ matrix.shard }}

  integration:
    name: Build integrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packing the generated application needs the same built packages as the unit suites.
      - run: pnpm build
      - name: Locale middleware matcher contracts on the supported floor
        run: |
          next_floor_dir="$RUNNER_TEMP/middleware-next-162"
          npm install --prefix "$next_floor_dir" --ignore-scripts --omit=optional --no-package-lock --no-audit --no-fund next@16.2.0
          UPWIND_MATCHER_NEXT_PACKAGE="$next_floor_dir/package.json" pnpm exec vitest run --project adapter --project runtime packages/adapter/test/payload-matcher.test.ts packages/adapter/test/build-middleware-budget.test.ts packages/runtime/test/locale-redirect.test.ts
      # One real Next.js build plus an HTTP request through the emitted Function. The remaining
      # fixtures and Next.js releases stay in the scheduled matrix workflow.
      - name: External output integration
        run: |
          matrix_next_version="$(node -p 'require("./packages/adapter/node_modules/next/package.json").version')"
          pnpm check:matrix --fixture next-external-output --versions "$matrix_next_version"
      - name: WebSocket Worker and development integration
        run: |
          matrix_next_version="$(node -p 'require("./packages/adapter/node_modules/next/package.json").version')"
          UPWIND_WEBSOCKET_DEV_CHECK=1 pnpm check:matrix --fixture next-websocket --versions "16.2.0,$matrix_next_version"
      # The compiler a new application installs is independent of this workspace's catalog. Pack
      # its own dependencies locally so a release PR does not require its version on npm already.
      - name: Generated application typecheck
        run: |
          scaffold_dir="$(mktemp -d)"
          for package in core runtime adapter upwind; do
            pnpm --dir "packages/$package" pack --out "$scaffold_dir/$package.tgz"
          done
          node packages/create-upwind/dist/cli.js "$scaffold_dir/app" --skip-install --no-git
          node --input-type=module - "$scaffold_dir" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const root = process.argv[2];
          const manifestPath = path.join(root, 'app/package.json');
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          manifest.devDependencies.upwind = `file:${root}/upwind.tgz`;
          manifest.devDependencies['@stayingupwind/adapter'] = `file:${root}/adapter.tgz`;
          manifest.overrides = {
            '@stayingupwind/core': `file:${root}/core.tgz`,
            '@stayingupwind/runtime': `file:${root}/runtime.tgz`,
          };
          await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          cd "$scaffold_dir/app"
          npm install --no-audit --no-fund
          npm exec -- next typegen
          npm exec -- tsc --noEmit

  test:
    if: ${{ always() }}
    needs: [unit-tests, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all tests and integrations
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  twoslash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      UPWIND_MATRIX_BASELINE: 947ade99e46b4cdeb11f4dc7fe2889076f993411
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Record the exact SDK baseline checkout
        env:
          UPWIND_MATRIX_PROOF_DIR: ${{ runner.temp }}/twoslash-proof
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          const baseline = process.env.UPWIND_MATRIX_BASELINE;
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const changed = execFileSync('git', ['diff', '--name-only', baseline, head, '--', 'packages'], { encoding: 'utf8' }).trim();
          const directory = process.env.UPWIND_MATRIX_PROOF_DIR;
          mkdirSync(directory, { recursive: true });
          writeFileSync(path.join(directory, 'checkout.json'), `${JSON.stringify({ head, baseline, productionPackagesUnchanged: changed === '' }, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_ENV, `UPWIND_MATRIX_SDK_HEAD=${head}\nUPWIND_MATRIX_PROOF_DIR=${directory}\n`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stayingupwind/adapter build
      - name: Compiled Twoslash route and emitted Function
        run: pnpm check:matrix --fixture next-twoslash --versions 16.4.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: twoslash-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/twoslash-proof
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  large-prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Record the exact SDK checkout
        env:
          UPWIND_MATRIX_PROOF_DIR: ${{ runner.temp }}/large-prerender-proof
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const directory = process.env.UPWIND_MATRIX_PROOF_DIR;
          mkdirSync(directory, { recursive: true });
          writeFileSync(path.join(directory, 'checkout.json'), `${JSON.stringify({ head }, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_ENV, `UPWIND_MATRIX_SDK_HEAD=${head}\nUPWIND_MATRIX_PROOF_DIR=${directory}\n`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stayingupwind/adapter build
      - name: Large completed pages and emitted Function
        run: pnpm check:matrix --fixture next-large-prerender-bodies --versions 16.4.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: large-prerender-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/large-prerender-proof
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stayingupwind/adapter build
      - name: Node handler lifetime after completed GET responses
        env:
          UPWIND_MATRIX_PROOF_DIR: ${{ runner.temp }}/instrumentation-proof
        run: node tools/next-matrix/src/node-handler-lifetime.ts
      - name: Compiled host and project instrumentation
        if: ${{ !cancelled() }}
        env:
          UPWIND_MATRIX_PROOF_DIR: ${{ runner.temp }}/instrumentation-proof
        run: |
          set -euo pipefail
          matrix_next_version="$(node -p 'require("./packages/adapter/node_modules/next/package.json").version')"
          failed=0
          for fixture in next-edge-instrumentation next-edge-instrumentation-no-own next-edge-instrumentation-baseline; do
            if ! pnpm check:matrix --fixture "$fixture" --versions "$matrix_next_version"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compiled-instrumentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/instrumentation-proof
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # A build served as it is deployed, on one machine (`@stayingupwind/local`): `fixtures/next-local`,
  # built through the cache's adapter preset, served by a local stack of the standalone edge, the
  # runtime cache and the prefetch Worker, and asked once for every document and file it
  # prerendered. The fixture is not a workspace package (as `tools/next-matrix` explains), so npm
  # installs it apart, with the Next.js it pins.
  local-check-shards:
    name: local stack shard (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stayingupwind/adapter build
      - run: npm install --no-audit --no-fund
        working-directory: fixtures/next-local
      - run: npm run build:local
        working-directory: fixtures/next-local
      # What the check leaves unasked: what the fixture renders on request (its README).
      - run: node probe.mts
        if: ${{ matrix.shard == 1 }}
        working-directory: fixtures/next-local
      # Each shard keeps the entire deployment and every check within its assigned entries.
      - run: pnpm local:check --dir fixtures/next-local --shard "$SHARD_INDEX/8"
        env:
          SHARD_INDEX: ${{ matrix.shard }}

  local-check:
    name: local stack (next-local)
    if: ${{ always() }}
    needs: [local-check-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all local stack shards
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  # `upwind preview` as it is installed: the packages packed, a copy of the deploy fixture installed
  # from the packs and built with `upwind build`, and the command run from that copy — the stack's
  # Workers the ones it ships, not bundled from this repository's sources.
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before packing, as the deploy workflow's build: the adapter's `exports` name its `dist/`.
      - run: pnpm build
      # Checked once, then served, asked and stopped.
      - run: pnpm check:preview --out "$RUNNER_TEMP/preview"

  # The deploy-tests hooks on the runner's targets, for real (`tools/deploy-tests/src/check-local.ts`):
  # `fixtures/next-minimal` installed, built and served by the deploy hook on Cloudflare's runtime or on
  # Node.js's, asked, its markers read back by the logs hook, and its server stopped by the cleanup hook.
  # What the nightly suite runs on, checked on every pull request without Next.js's own checkout.
  deploy-tests-local:
    name: deploy-tests hooks (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [cloudflare, node]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `dist`, because that is the adapter the hook names, as a release hands it to a project.
      - run: pnpm --filter @stayingupwind/adapter build
      - run: pnpm check:deploy-tests-local --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web-site
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Website adapter selection
        timeout-minutes: 2
        run: |
          node --test scripts/check-adapter-config.test.mjs
          node scripts/check-adapter-config.mjs "$RUNNER_TEMP/website-adapter-config-check.json"
      - run: pnpm run typegen
      - run: pnpm typecheck
      # Build the website with its released adapter, independently of workspace packages.
      - run: pnpm build
      - name: Compiled Edge middleware behavior
        timeout-minutes: 2
        run: node scripts/check-middleware.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-middleware-${{ github.run_id }}-${{ github.run_attempt }}
          path: web-site/.arkor/middleware-check.json
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-adapter-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/website-adapter-config-check.json
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', web-site]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml
      # The website has its own lockfile and installs the released CLI and adapter as dev
      # dependencies. Audit both dependency graphs, including their build tools.
      # Auditing the locked dependency graph does not need install scripts or build outputs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level low
