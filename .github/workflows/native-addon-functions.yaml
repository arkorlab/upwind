name: Native addon Functions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-addon-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-function:
    name: Linux native Function artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [24.22.1, 26.13.0]
        next: ['16.4.3', '16.4.4', '16.4.5', '16.4.6']
        include:
          - next: '16.4.3'
            next-commit: 29bbeab09981148ade186e8599ecdede15abc281
          - next: '16.4.4'
            next-commit: b175f52b05a5f6c6c39ca72565ea178542be323b
          - next: '16.4.5'
            next-commit: 4e5335a00314be7fbb2aace5e9be56a88e64e5a8
          - next: '16.4.6'
            next-commit: 54b876b6b161b0ecda19562eb264bec637e60d6d
    env:
      # The official fixtures build with this release; the SDK's own tests pin theirs.
      UPWIND_NATIVE_NEXT: ${{ matrix.next }}
      # Release-independent checks run once per Node.js version, in the newest release's leg.
      RELEASE_INDEPENDENT: ${{ matrix.next == '16.4.6' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        id: build
      - name: Create an isolated artifact mount
        run: sudo install -d -m 0777 /bundle
      - name: Compile, package and invoke a real native addon
        if: env.RELEASE_INDEPENDENT == 'true'
        run: pnpm exec vitest run --project adapter packages/adapter/test/native-container-integration.test.ts
        env:
          UPWIND_NATIVE_FUNCTION_INTEGRATION: '1'
      - name: Verify failure diagnostic filesystem boundaries
        if: env.RELEASE_INDEPENDENT == 'true'
        run: pnpm exec vitest run --project adapter packages/adapter/test/native-next-diagnostics.test.ts
      - name: Verify the fixed Node dependency evaluation guard
        if: env.RELEASE_INDEPENDENT == 'true'
        run: pnpm exec vitest run --project adapter packages/adapter/test/node-jwt-guard-integration.test.ts
        env:
          UPWIND_NATIVE_FUNCTION_INTEGRATION: '1'
      - name: Verify the fixed Node fast-jwt evaluation guard (Next.js 16.4.4 to 16.4.6)
        if: env.RELEASE_INDEPENDENT == 'true'
        run: pnpm exec vitest run --project adapter packages/adapter/test/node-fast-jwt-guard-integration.test.ts
        env:
          UPWIND_NATIVE_FUNCTION_INTEGRATION: '1'
      - name: Verify the fixed WebSocket optional dependency guard
        if: env.RELEASE_INDEPENDENT == 'true'
        run: pnpm exec vitest run --project adapter packages/adapter/test/node-ws-guard-integration.test.ts
        env:
          UPWIND_NATIVE_FUNCTION_INTEGRATION: '1'
      - name: Verify the fixed Turbopack selector specialization
        if: env.RELEASE_INDEPENDENT == 'true'
        run: pnpm exec vitest run --project adapter packages/adapter/test/node-turbopack-selector-integration.test.ts
        env:
          UPWIND_NATIVE_FUNCTION_INTEGRATION: '1'
      - name: Verify complete original Node export closures
        if: env.RELEASE_INDEPENDENT == 'true'
        run: pnpm exec vitest run --project adapter packages/adapter/test/node-raw-closure-integration.test.ts
        env:
          UPWIND_NATIVE_FUNCTION_INTEGRATION: '1'
      - name: Check out the fixed Next.js ${{ matrix.next }} native fixtures
        shell: bash
        env:
          NEXT_COMMIT: ${{ matrix.next-commit }}
        run: |
          set -euo pipefail
          fixture_source="$RUNNER_TEMP/upwind-official-native-next"
          git init --quiet "$fixture_source"
          git -C "$fixture_source" remote add origin https://github.com/vercel/next.js.git
          git -C "$fixture_source" sparse-checkout init --no-cone
          git -C "$fixture_source" sparse-checkout set --no-cone '/test/e2e/prerender-native-module/' '/test/e2e/app-dir/turbopack-reports/'
          git -C "$fixture_source" fetch --no-tags --depth=1 origin "$NEXT_COMMIT"
          git -C "$fixture_source" checkout --detach FETCH_HEAD
          test "$(git -C "$fixture_source" rev-parse HEAD)" = "$NEXT_COMMIT"
      - name: Build and invoke the official native fixture and fallback path
        id: official_native
        run: node tools/native-addon-next-ci.mts "$RUNNER_TEMP/upwind-official-native-next/test/e2e/prerender-native-module"
      - name: Retain bounded public fixture JavaScript after failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-next-compiled-js-${{ matrix.node }}-next-${{ matrix.next }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upwind-native-next-diagnostics
          if-no-files-found: warn
          retention-days: 1
      - name: Diagnose the failed fixture with server minification disabled
        id: official_native_diagnostic
        if: failure() && !cancelled() && steps.official_native.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          fixture_source="$RUNNER_TEMP/upwind-official-native-next/test/e2e/prerender-native-module"
          diagnostic_root="$RUNNER_TEMP/upwind-native-next-server-minification-off"
          mkdir "$diagnostic_root"
          RUNNER_TEMP="$diagnostic_root" node tools/native-addon-next-ci.mts "$fixture_source" --server-minification=off
      - name: Retain separate JavaScript after the diagnostic fails
        if: failure() && steps.official_native_diagnostic.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-next-server-minification-off-js-${{ matrix.node }}-next-${{ matrix.next }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upwind-native-next-server-minification-off/upwind-native-next-diagnostics
          if-no-files-found: warn
          retention-days: 1
      - name: Build and invoke the official App Router native fixture
        id: official_native_app
        if: always() && !cancelled() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          fixture_source="$RUNNER_TEMP/upwind-official-native-next/test/e2e/app-dir/turbopack-reports"
          app_root="$RUNNER_TEMP/upwind-native-next-app-router"
          mkdir "$app_root"
          RUNNER_TEMP="$app_root" node tools/native-addon-next-ci.mts "$fixture_source"
      - name: Retain bounded App Router fixture JavaScript after failure
        if: failure() && steps.official_native_app.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-next-app-router-js-${{ matrix.node }}-next-${{ matrix.next }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upwind-native-next-app-router/upwind-native-next-diagnostics
          if-no-files-found: warn
          retention-days: 1
      - name: Verify the fixed Next require hook bootstrap
        if: always() && !cancelled() && steps.build.outcome == 'success' && env.RELEASE_INDEPENDENT == 'true'
        run: pnpm exec vitest run --project runtime packages/runtime/test/node-next-hook-bootstrap-integration.test.ts
        env:
          UPWIND_NATIVE_FUNCTION_INTEGRATION: '1'
