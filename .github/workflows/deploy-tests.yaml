name: Deploy tests

# Next.js's own deploy-mode suite, against whole deployments of what this adapter builds: on a host
# (`target: host`), or on the runner, on Cloudflare's runtime (`cloudflare`, a local stack on workerd)
# or on Node.js's (`node`, the native server `upwind start` runs) — `tools/deploy-tests/README.md`.
#
# Apart from CI, for two reasons. On a host it needs credentials, which a pull request from a fork must
# never be given. And every target deploys — each suite is an application installed, built and served, a
# minute of it at the least. So it is dispatched by hand, and the two targets on the runner, which need
# no credential, also run every night over the whole manifest. CI checks the hooks themselves on every
# pull request (`check:deploy-tests`, `check:deploy-tests-local`).
#
# What follows of projects and queues is a host's: on the runner each application has a server of its
# own, every shard runs at once, and each runs two suites at a time.
#
# **One project takes one fixture at a time.** Every deployment replaces the project's whole runtime
# environment and changes which deployment the suite's requests reach, so two shards sharing a project would
# take each other's application away mid-test. Splitting the *list* is upstream's own `-g n/total`;
# running the pieces at the same time is what has to be bought, with a project per shard. So the number
# of ids in `ADAPTER_TEST_PROJECT_IDS` is the parallelism, and with one id the shards queue behind each
# other.
#
# **That is what bounds a full run.** The manifest selects around 1,100 suites, about six hundred of
# which deploy (the rest declare `skipDeployment`), against two limits: 6 hours of execution per job, and
# **24 hours in the queue before a job is cancelled**. Queueing behind one project, the shards have to
# satisfy both at once, and they pull in opposite directions: a shard runs for `total / n` plus about three
# minutes of its own setup (two checkouts, two installs, Next.js built, Chromium), which wants `n` large,
# and the last one starts after the other `n - 1` of those, which wants `n` small. Measured: a full pass in
# six shards took 11h41m, about two hours a shard, the last starting nine and three-quarter hours in. A
# settle (`ADAPTER_TEST_SETTLE_SECONDS`) is paid by every deploying suite, so at its one-minute ceiling it
# adds about a hundred minutes a shard — still well inside both limits at six. A run much longer than the
# measured one wants as many projects as it has shards, or the slices taken one dispatch at a time with
# `only`.
#
# **So a host is cut into a shard a project.** Unless `shards` says otherwise, a run of the whole
# manifest takes as many pieces as the list names different projects before one repeats, up to
# `HOST_SHARDS`, and every piece runs at once. Under six projects it stays the six measured above, one
# after another: the split measured inside both limits, where two or three pieces at once would each run
# for most of a job's six hours, or past them.

on:
  # Every night, both targets on the runner over the whole manifest (`plan`).
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where each application is served: a host, or the runner on Cloudflare or Node.js'
        default: 'host'
        type: choice
        options:
          - host
          - cloudflare
          - node
      nextjsRef:
        description: "Next.js ref to test against — inside the adapter's supported range"
        default: 'v16.4.3'
        type: string
      tests:
        description: 'Upstream test paths, space separated — or `all` for the whole manifest'
        default: >-
          test/e2e/hello-world/hello-world.test.ts
          test/e2e/app-dir/hello-world/hello-world.test.ts
          test/e2e/app-dir/app-simple-routes/app-simple-routes.test.ts
        type: string
      shards:
        description: 'How many pieces to cut `all` into, 1 to 64 — when empty, a piece a project on a host (at most 32; 6 under six projects) and 64 on the runner'
        default: ''
        type: string
      only:
        description: 'Run just this shard of that many — for taking a slice again on its own; on a host, with the `shards` the run had'
        default: ''
        type: string
      concurrency:
        description: 'Suites run at once in a shard (`-c`): 1 on a host, 2 on the runner when empty'
        default: ''
        type: string
      cache:
        description: 'On a host: the adapter alone (`none`), or the runtime cache a host serves behind its own edge (`hosted`)'
        default: 'none'
        type: choice
        options:
          - none
          - hosted

permissions: {}

env:
  # The Next.js a night's run tests against: the one a dispatch defaults to (`nextjsRef`), which moves
  # with it.
  NIGHTLY_NEXTJS_REF: 'v16.4.3'
  # The pieces the runner's targets are cut into, a night's run and a dispatch that names none: as fine
  # as the plan cuts. Both targets in 64 pieces each is 128 jobs, inside the 256 a matrix holds, and
  # each piece about seventeen suites — a job a few minutes long beside its own setup.
  RUNNER_SHARDS: '64'
  # The most pieces a host's run of the whole manifest is cut into when a dispatch names none: one a
  # project, every one at once (`plan`). At thirty-two, some twenty of the suites that deploy a piece.
  HOST_SHARDS: '32'

# Never two runs on a host at once: they would be deploying into the same projects. The runner's
# targets share nothing, so each of their runs is a group of its own — one group for them all would
# hold one run and one waiting, and cancel the one waiting when another was dispatched.
concurrency:
  group: ${{ github.event_name != 'schedule' && inputs.target == 'host' && 'deploy-tests-host' || format('deploy-tests-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Everything that can be answered before a runner does anything expensive: what the selection means,
  # how many pieces it is in, and how many of them may run at once.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      parallel: ${{ steps.plan.outputs.parallel }}
      concurrency: ${{ steps.plan.outputs.concurrency }}
      nextjs: ${{ steps.plan.outputs.nextjs }}
      tests: ${{ steps.plan.outputs.tests }}
      cache: ${{ steps.plan.outputs.cache }}
    steps:
      - name: Work out the shards
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          NEXTJS_REF: ${{ inputs.nextjsRef }}
          TESTS: ${{ inputs.tests }}
          SHARDS: ${{ inputs.shards }}
          ONLY: ${{ inputs.only }}
          CONCURRENCY: ${{ inputs.concurrency }}
          CACHE: ${{ inputs.cache }}
          # Counted, never printed: the count is not a project anybody can name, the ids are.
          PROJECT_IDS: ${{ secrets.ADAPTER_TEST_PROJECT_IDS }}
          PROJECT_ID: ${{ secrets.ADAPTER_TEST_PROJECT_ID }}
        run: |
          set -euo pipefail
          # A night's run is both of the runner's targets over the whole manifest, cut as finely as
          # `RUNNER_SHARDS` says; a dispatch is what it was asked for.
          if [ "$EVENT" = 'schedule' ]; then
            targets='cloudflare node'
            TESTS='all'
            SHARDS="$RUNNER_SHARDS"
            ONLY=''
            CONCURRENCY=''
            nextjs="$NIGHTLY_NEXTJS_REF"
          else
            targets="$TARGET"
            nextjs="$NEXTJS_REF"
          fi
          # Outputs are line-oriented records. Refuse input that could introduce another record.
          case "$nextjs" in
            '' | *$'\r'* | *$'\n'*) echo 'nextjsRef must be a nonempty single line' >&2; exit 1 ;;
          esac
          case "$targets" in
            host | cloudflare | node | 'cloudflare node') ;;
            *) echo "target must be host, cloudflare or node, not '$targets'" >&2; exit 1 ;;
          esac
          selection="$(printf '%s' "$TESTS" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          if [ -z "$selection" ]; then
            echo 'no tests were selected: name upstream paths, or `all` for the whole manifest' >&2
            exit 1
          fi
          # At most two digits, checked before anything compares them: `[` on a number wider than the
          # shell's own range fails the *comparison*, and a failed comparison inside an `if` is a branch
          # not taken rather than a script stopped — after which `seq` would be asked for that many.
          # Two digits is all 1..64 needs.
          whole() {
            case "$2" in
              [0-9] | [0-9][0-9]) ;;
              *) echo "$1 must be one or two digits, not '$2'" >&2; exit 1 ;;
            esac
            # Base ten explicitly: a leading zero is octal to the shell and not a number at all to JSON,
            # so `01` would otherwise reach the matrix as `[01]` and expand to nothing.
            echo "$((10#$2))"
          }
          # A named selection is one job: `-g` would cut *those* paths into pieces, and nine of ten
          # shards of three paths are empty jobs that install Next.js to run nothing.
          # Unsaid, as many as the target allows: a host's projects bound it, nothing bounds the runner.
          # On a host that is a shard a project, up to `HOST_SHARDS`: the ids in order, read as the check
          # below reads them, up to the first that repeats, since the shards that run at once each take
          # their own. Under six, the six the header measured, one after another.
          if [ -z "$SHARDS" ]; then
            if [ "$targets" = 'host' ]; then
              projects="$(
                ids="$(printf '%s' "${PROJECT_IDS:-$PROJECT_ID}" | tr -d '\r')"
                set -f
                # shellcheck disable=SC2086 -- splitting the list is the parse, and globbing is off above
                set -- $ids
                printf '%s\n' "$@" | awk '!seen[$0]++ { n++; next } { exit } END { print n + 0 }'
              )"
              if [ "$projects" -lt 6 ]; then
                SHARDS=6
              elif [ "$projects" -gt "$HOST_SHARDS" ]; then
                SHARDS="$HOST_SHARDS"
              else
                SHARDS="$projects"
              fi
            else
              SHARDS="$RUNNER_SHARDS"
            fi
          fi
          if [ "$selection" = 'all' ]; then
            total="$(whole shards "$SHARDS")"
          else
            total=1
          fi
          # 256 jobs is the matrix limit; past a few dozen the setup of each is most of its time.
          if [ "$total" -lt 1 ] || [ "$total" -gt 64 ]; then
            echo "shards must be between 1 and 64, not $total" >&2
            exit 1
          fi
          if [ -n "$ONLY" ]; then
            only="$(whole only "$ONLY")"
            if [ "$only" -lt 1 ] || [ "$only" -gt "$total" ]; then
              echo "only must name one of the $total shards, not $only" >&2
              exit 1
            fi
            shards="[$only]"
          else
            shards="$(seq -s, 1 "$total" | sed 's/^/[/; s/$/]/')"
          fi
          # How many suites a shard runs at once: one on a host, whose project takes one fixture at a
          # time; two on the runner, where each application has a server of its own.
          if [ -n "$CONCURRENCY" ]; then
            concurrency="$(whole concurrency "$CONCURRENCY")"
          elif [ "$targets" = 'host' ]; then
            concurrency=1
          else
            concurrency=2
          fi
          if [ "$concurrency" -lt 1 ] || [ "$concurrency" -gt 8 ]; then
            echo "concurrency must be between 1 and 8, not $concurrency" >&2
            exit 1
          fi
          if [ "$targets" = 'host' ] && [ "$concurrency" -ne 1 ]; then
            echo 'a project on a host takes one fixture at a time: concurrency must be 1 there' >&2
            exit 1
          fi
          # The runtime cache a host's builds are given: none but on a host, where the runner's targets
          # serve a cache of their own or none (`tools/deploy-tests/scripts/e2e-deploy.sh`). A night's
          # run names none.
          cache="${CACHE:-none}"
          case "$cache" in
            none) ;;
            hosted)
              if [ "$targets" != 'host' ]; then
                echo 'cache hosted is for a host: the targets on the runner serve their own' >&2
                exit 1
              fi
              ;;
            *) echo "cache must be none or hosted, not '$cache'" >&2; exit 1 ;;
          esac
          # The jobs: each target's shards, as the matrix takes them.
          include=''
          jobs=0
          for target in $targets; do
            for shard in $(printf '%s' "$shards" | tr -d '[]' | tr ',' ' '); do
              include="${include:+$include,}{\"target\":\"$target\",\"shard\":$shard}"
              jobs=$((jobs + 1))
            done
          done
          # On the runner nothing is shared, and every job runs at once; on a host, as many as there
          # are projects for (below).
          parallel="$jobs"
          if [ "$targets" = 'host' ]; then
            # The ids, split on whitespace by the shell itself: a pipeline that counts lines one way and
            # picks one another way disagrees about a list that begins with a space, and then a shard is
            # handed the empty string. `-f` with it, because the same unquoted expansion would otherwise
            # also expand pathnames — an id holding `*`, `?` or `[` would be matched against whatever the
            # runner's working directory happens to contain, and a match would quietly replace it.
            # Carriage returns out first: the shell splits on space, tab and newline, so a list pasted from
            # CRLF text leaves `\r` stuck to every id but the last. Two spellings of one project would then
            # count as two projects here, while everything downstream trims it away — `$GITHUB_ENV` when it
            # reads the line back, `required()` in `config.ts` before it asks the API — and two shards would
            # be deploying into the one project the count said they were not.
            ids="$(printf '%s' "${PROJECT_IDS:-$PROJECT_ID}" | tr -d '\r')"
            set -f
            # shellcheck disable=SC2086 -- splitting the list is the parse, and globbing is off above
            set -- $ids
            if [ "$#" -lt 1 ]; then
              echo 'ADAPTER_TEST_PROJECT_IDS (or ADAPTER_TEST_PROJECT_ID) names no project' >&2
              exit 1
            fi
            # Shards run at once only when every one of them has a project of its own. `max-parallel` caps
            # how many jobs run, not which project each holds: with two ids and six shards it would start
            # job 3 the moment job 2 ended, and job 3's project is job 1's, which is still deploying into
            # it. Fewer ids than shards is therefore one at a time — slower, and not two fixtures taking
            # each other's environment away.
            #
            # Counting them is not enough: a list long enough but with an id repeated — a paste gone wrong —
            # would pass and then give two shards the same project. What has to be true is that the ids the
            # shards would actually take are different projects, which is the first `total` of them, since
            # that is where shard `k` looks when there are enough to go round.
            distinct="$(printf '%s\n' "$@" | awk -v n="$total" 'NR <= n && !seen[$0]++ { c++ } END { print c + 0 }')"
            if [ "$#" -ge "$total" ] && [ "$distinct" -eq "$total" ]; then
              parallel="$total"
            else
              parallel=1
            fi
          fi
          {
            echo "matrix={\"include\":[$include]}"
            echo "total=$total"
            echo "parallel=$parallel"
            echo "concurrency=$concurrency"
            echo "nextjs=$nextjs"
            echo "tests=$selection"
            echo "cache=$cache"
          } >>"$GITHUB_OUTPUT"
          # One shard asked for by name is one job: nothing of the rest of the split runs, so nothing
          # about how many could have run at once is true of it.
          if [ -n "$ONLY" ]; then
            echo "$targets, $selection: shard $only of $total, on its own" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "$targets, $selection in $total shard(s) each, $parallel at a time, $concurrency suite(s) at once in each" \
              >>"$GITHUB_STEP_SUMMARY"
            # Said out loud, because one at a time where more was asked for is a list to fix rather than
            # a run to wonder about. Which ids, and how many, stay out of it.
            if [ "$parallel" -lt "$jobs" ]; then
              echo 'fewer projects than shards, or two shards on one project: they queue' \
                >>"$GITHUB_STEP_SUMMARY"
            fi
          fi
          # Said as well, since a cached build answers caching suites a release's adapter fails.
          if [ "$cache" = hosted ]; then
            echo 'every Function built with the runtime cache a host serves behind its own edge' \
              >>"$GITHUB_STEP_SUMMARY"
          fi

  deploy-tests:
    needs: plan
    name: ${{ matrix.target }} ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
    runs-on: ubuntu-latest
    # Under the six hours a job is allowed, with room for a slice that runs long to be reported rather
    # than cut off mid-suite.
    timeout-minutes: 340
    permissions:
      contents: read
    strategy:
      # An inventory, not a gate: a shard that fails has found something, and the others still have
      # their own ground to cover.
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adapter
      # The suite is upstream's, run unmodified: its own manifest decides which suites deploy mode
      # selects, and this repository rewrites no expectation of theirs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vercel/next.js
          ref: ${{ needs.plan.outputs.nextjs }}
          path: nextjs
          fetch-depth: 25
      # Scratch only: the header checks out, so the checks after them run on this target.
      - name: Take out the x-vercel-cache assertions
        working-directory: nextjs
        run: |
          files='test/e2e/app-dir/cache-components-prerender-matrix/cache-components-prerender-matrix.test.ts test/e2e/app-dir/partial-fallback-shell-upgrade/partial-fallback-shell-upgrade.test.ts'
          perl -0pi -e "s/expect\(([\w.]+)\.headers\.get\('x-vercel-cache'\)\)\.toBe\(/void (/g" $files
          grep -n "x-vercel-cache" $files || true
          git diff --stat
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Corepack rather than `pnpm/action-setup`, which reads one `packageManager` from where it runs:
      # there are two checkouts here and no manifest above them, and they do not agree on a version.
      # This way each directory's own `packageManager` is honoured — Next.js's inside `nextjs`, this
      # repository's inside `adapter`.
      - run: corepack enable

      # This repository first, so that the next step can ask the API a question before anything long
      # happens: the adapter's own install is a minute, and building Next.js from source is twenty.
      - name: Install this repository
        working-directory: adapter
        run: pnpm install --frozen-lockfile

      # The token goes into a file, and the step that runs the suite is given its path. Everything
      # below the deploy hook — the application's install, its build, the suite itself — inherits that
      # step's environment, and all of it is code this repository checked out from somewhere else. A
      # path is the one thing worth inheriting.
      #
      # A reduction, not a boundary: the file and the suite belong to the same user on the same
      # machine. What it removes is the ordinary way a secret escapes, which is something printing the
      # environment it was handed — and `nextjsRef` should name a tag for the same reason.
      - name: Put the token in a file
        if: matrix.target == 'host'
        env:
          TOKEN: ${{ secrets.ARKOR_API_TOKEN }}
        run: |
          umask 077
          printf '%s' "$TOKEN" >"$RUNNER_TEMP/deploy-token"

      # This shard's own project, by position in the list. Masked first: it is one word of a secret
      # rather than the secret, so nothing else would keep it out of a log.
      - name: Take a project for this shard
        if: matrix.target == 'host'
        env:
          SHARD: ${{ matrix.shard }}
          PROJECT_IDS: ${{ secrets.ADAPTER_TEST_PROJECT_IDS }}
          PROJECT_ID: ${{ secrets.ADAPTER_TEST_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Read exactly as the plan reads it — carriage returns out, globbing off, split by the shell —
          # so that the id a shard takes is the id the plan counted, however the list was pasted. Wrapping round, because fewer ids than shards is a run the plan has
          # already made serial: the shards of one project queue behind each other rather than sharing it.
          ids="$(printf '%s' "${PROJECT_IDS:-$PROJECT_ID}" | tr -d '\r')"
          set -f
          # shellcheck disable=SC2086 -- splitting the list is the parse, and globbing is off above
          set -- $ids
          shift "$(( (SHARD - 1) % $# ))"
          echo "::add-mask::$1"
          echo "ADAPTER_TEST_PROJECT_ID=$1" >>"$GITHUB_ENV"

      # Before anything long, which is the point of having it: a token that cannot write, or a project
      # id that names somebody else's application, is worth a minute's wait to learn about rather than
      # twenty minutes of building Next.js and then a suite that failed for a reason of its own.
      - name: Preflight
        if: matrix.target == 'host'
        working-directory: adapter
        env:
          ARKOR_API_URL: ${{ secrets.ARKOR_API_URL }}
          ARKOR_API_TOKEN_FILE: ${{ runner.temp }}/deploy-token
          # Read here too, so that a value the tool would refuse is refused before the long part.
          ADAPTER_TEST_SETTLE_SECONDS: ${{ secrets.ADAPTER_TEST_SETTLE_SECONDS }}
        run: pnpm test:deploy preflight

      # Next.js is built from source, and installed again afterwards, because its test harness runs out
      # of the checkout and loads what it just built.
      - name: Build Next.js
        working-directory: nextjs
        # A few minutes on a runner: bounded well short of the job's own limit, which is there for a
        # slow slice of suites, not for a build that stalled.
        timeout-minutes: 30
        run: pnpm install && pnpm build && pnpm install
      # Downloads and apt: a stall is tried again rather than holding the shard until the job's limit,
      # as two shards were held on 2026-10-26, five and a half hours each before they were cancelled.
      - name: Install Chromium
        working-directory: nextjs
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            # Killed where it does not stop when asked, so that one stuck attempt leaves the others.
            if timeout --kill-after=15s 6m pnpm playwright install --only-shell chromium; then exit 0; fi
            echo "::warning::Chromium's install did not finish (attempt ${attempt} of 3)"
          done
          exit 1
      # The pnpm Corepack falls back to, made the one Next.js's harness pins every fixture to (its own
      # `packageManager`). A fixture that pins another manager pins no pnpm, and the deploy hook tells
      # Corepack not to fetch the newest for it (`COREPACK_DEFAULT_TO_LATEST=0`): what it runs then is
      # this. Corepack's own fallback is newer, and pnpm 11 and 12 refuse a project pinned to npm.
      - name: Make Next.js's pnpm the one Corepack falls back to
        working-directory: nextjs
        run: corepack install -g "$(node -p "require('./package.json').packageManager")"

      # `dist`, because that is the adapter as a release hands it to a project.
      - name: Build the adapter
        working-directory: adapter
        run: pnpm --filter @stayingupwind/adapter build

      # On a host serially (`-c 1`), on the runner two at a time, and with no retries: a retry would
      # deploy the same fixture again and say nothing about why the first one failed. A suite that fails does not stop the rest — the runner carries on
      # and reports every one at the end, which is what makes a long run an inventory. Its own job
      # summary lists the failures, so a shard's findings are readable without opening the log.
      # Scratch only: the npm the hook's npm installer requires (`tools/deploy-tests/README.md`).
      - name: Install npm 11.19.1
        run: npm install -g npm@11.19.1 && npm --version
      - name: Run the suite
        working-directory: nextjs
        env:
          NEXT_TEST_MODE: deploy
          # What a suite's hooks and tests may take. A deploy is the suite's `beforeAll`: a fixture of a few
          # hundred prerendered pages takes a host minutes to bring in — four were not enough for three of
          # a full run's — and the hook may first wait up to ten for the project's previous run to end
          # (`finalize.ts`), so twenty in all. The deploy hook ends any wait of its own where this time
          # does, rather than be cut off in it (`hook.ts`).
          NEXT_E2E_TEST_TIMEOUT: 1200000
          # What Next.js's own job for adapters sets (`test_e2e_deploy_release.yml`, the adapter matrix).
          # A few suites expect a deployment an adapter made to answer otherwise than one Vercel's own
          # builder made, and read it to know which they are testing: with it set, they expect the
          # adapter's answers; without it, the builder's.
          NEXT_ENABLE_ADAPTER: 1
          NEXT_EXTERNAL_TESTS_FILTERS: test/deploy-tests-manifest.json
          NEXT_TELEMETRY_DISABLED: 1
          IS_TURBOPACK_TEST: 1
          NEXT_TEST_JOB: 1
          ADAPTER_DIR: ${{ github.workspace }}/adapter
          NEXT_TEST_DEPLOY_SCRIPT_PATH: ${{ github.workspace }}/adapter/tools/deploy-tests/scripts/e2e-deploy.sh
          NEXT_TEST_DEPLOY_LOGS_SCRIPT_PATH: ${{ github.workspace }}/adapter/tools/deploy-tests/scripts/e2e-logs.sh
          NEXT_TEST_CLEANUP_SCRIPT_PATH: ${{ github.workspace }}/adapter/tools/deploy-tests/scripts/e2e-cleanup.sh
          # Where each application is served: a host, or this runner (`tools/deploy-tests/src/target.ts`).
          ADAPTER_TEST_TARGET: ${{ matrix.target }}
          # The runtime cache a host's builds are given, as the plan read it (`e2e-deploy.sh`).
          ADAPTER_TEST_CACHE: ${{ needs.plan.outputs.cache }}
          # The host to deploy to, and nothing on the runner's targets. Secrets rather than anything
          # written down here: which host runs this suite is whoever dispatched it, and a project id in a
          # log is a project somebody can name. The token itself is not among them — it is in the file
          # named below, and this shard's project came from the step above through the environment.
          ARKOR_API_URL: ${{ matrix.target == 'host' && secrets.ARKOR_API_URL || '' }}
          ARKOR_API_TOKEN_FILE: ${{ matrix.target == 'host' && format('{0}/deploy-token', runner.temp) || '' }}
          # How long the host takes to bring a deployment in for every request, which only whoever runs
          # the host knows; unset is "at once". A secret like the rest, so that it is not printed either.
          ADAPTER_TEST_SETTLE_SECONDS: ${{ matrix.target == 'host' && secrets.ADAPTER_TEST_SETTLE_SECONDS || '' }}
          # Through the environment rather than into the command: the selection is a string this workflow
          # was handed, and a `run:` that interpolates one is a shell that was handed it too.
          TESTS: ${{ needs.plan.outputs.tests }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ needs.plan.outputs.total }}
          CONCURRENCY: ${{ needs.plan.outputs.concurrency }}
        # Paths are positional, after the flags, and `all` names none of them: with nothing positional
        # the runner takes everything its manifest allows. `-g` only where there is more than one piece,
        # since a single group is the whole list and asking for it warns about timing data it does not
        # need. Unquoted on purpose: the selection is several paths, and a quoted one would be a single
        # path with spaces in it. Whether there is one at all was answered by the plan.
        run: |
          set -euo pipefail
          group=''
          if [ "$TOTAL" -gt 1 ]; then
            group="-g $SHARD/$TOTAL"
          fi
          paths=''
          if [ "$(printf '%s' "$TESTS" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')" != 'all' ]; then
            paths="$TESTS"
          fi
          # shellcheck disable=SC2086 -- both are several words, or none, on purpose
          node run-tests.js --type e2e -c "$CONCURRENCY" --retries 0 $group $paths
