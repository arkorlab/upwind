name: Publish

# The half of a release that does the work. It is reusable so that what a release *is* — a signed
# tag, on the default branch, saying the version the packages say — is written once and cannot drift
# between the ways a release is started.
#
# npm's trusted publisher does NOT name this file. npm validates the OIDC token's `workflow_ref`,
# which is the workflow a run entered by, not the one the publishing job lives in: the name npm is
# configured with is `release.yaml`. Renaming *that* file stops every release until npm is told.
#
# The shape follows SLSA: the tag is verified where nothing can publish, publishing authenticates
# with an identity that outlives no run — there is no token here, and no secret to leak — and the
# provenance the registry recorded is read back afterwards, so a release that produced no
# attestation fails loudly instead of quietly.
#
# Adding a package takes one release that cannot come through here, because npm will not hold a
# trusted publisher for a name that does not exist yet. Twice now the answer has been a `bootstrap`
# input carrying a token for that one release, removed again afterwards; the history has the shape of
# it. Publishing the new names by hand instead would leave a version of each that no provenance
# covers — a statement is signed with this workflow's identity and nothing on a laptop has one — and
# the `provenance` job below would then fail a release over packages that are permanently unattested.
#
# Two things that release taught, for whoever does it next. npm answers 409 `Failed to save packument`
# when a run publishes one brand-new package straight after another, so expect to re-run once the
# first has settled; a recursive publish skips what is already up, and a version that 409s is not
# recorded, so nothing is burned by trying again. And a token beside a trusted publisher does not
# override it: pnpm asks per package, and only the one with no publisher fell back.
#
# Either way it has to be pnpm and not npm that packs. Three packages describe what they ship through
# `publishConfig` — the `bin` of `upwind` and of `create-upwind`, and the adapter's `exports`, each
# naming `dist/` there and the TypeScript sources outside it — and pnpm is what folds those in as it
# packs. `npm publish` would upload manifests pointing at `.ts` files no installed copy can load.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, as it was signed (`v0.1.0`).
        required: true
        type: string
      dry-run:
        description: Verify and build, and do everything but upload.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  verify:
    # Trust in a release starts here, and this job holds no `id-token`: nothing it can be made to do
    # can publish anything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          # The tag object itself, and enough history to prove where the tag stands.
          fetch-depth: 0
      # For `node`, below, to be the version this repository is written for rather than whichever
      # one the runner image happens to carry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: The tag carries a signature from a key this repository names
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only a tag object can be signed. A lightweight tag is a name pointing at a commit, and
          # `verify-tag` on one says nothing at all — so refuse it by its type first.
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != tag ]; then
            echo "::error::${TAG} is not an annotated tag object, so it carries no signature"
            exit 1
          fi
          # The runner's keyring starts empty and ends holding exactly the keys this file names, so a
          # good signature over the tag is a signature by one of them and by nobody else.
          gpg --batch --quiet --import .github/release-signers.asc
          # Read into a variable rather than piped into `grep -q`: a quiet grep leaves the pipeline
          # the moment it matches, and under `pipefail` the SIGPIPE that gives the writer would fail
          # this step on the good signature it just found.
          status="$(git verify-tag --raw "${TAG}" 2>&1 || true)"
          printf '%s\n' "${status}"
          case "${status}" in
            *'[GNUPG:] GOODSIG'*) ;;
            *)
              echo "::error::${TAG} carries no good signature from a key in .github/release-signers.asc"
              exit 1
              ;;
          esac

      - name: The tag stands on the default branch
        env:
          TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          # A signature says who made the tag, not what it names. This says the tree being published
          # is one that went through the branch every change is reviewed on.
          git fetch --no-tags --quiet origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::${TAG} does not stand on ${DEFAULT_BRANCH}"
            exit 1
          fi

      - name: The tag says the version the packages say
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          published=0
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./${manifest}').private === true")" = true ]; then
              continue
            fi
            name="$(node -p "require('./${manifest}').name")"
            version="$(node -p "require('./${manifest}').version")"
            if [ "${version}" != "${expected}" ]; then
              echo "::error file=${manifest}::${name} is ${version}, but ${TAG} says ${expected}"
              exit 1
            fi
            echo "${name}@${version}"
            published=$((published + 1))
          done
          if [ "${published}" -eq 0 ]; then
            echo "::error::no publishable package under packages/"
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A second gate a person holds, and the `environment` claim npm can be configured to require.
    environment: release
    permissions:
      contents: read
      # The OIDC token, for two things at once: pnpm exchanges it with npm for a short-lived grant to
      # publish these packages, and signs the provenance statement with it through Sigstore. The
      # caller has to grant this as well — a reusable workflow gets no more than it was given.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # Deliberately no `registry-url`: it writes an `.npmrc` naming `NODE_AUTH_TOKEN`, and this
          # job has no token to name — what it publishes with, it is handed at the moment it asks.

      - run: pnpm install --frozen-lockfile

      # The same checks CI runs. A tag on the default branch was green there, but "was green" is not
      # "is green on this tree", and a release is the one place worth paying for the difference.
      - run: pnpm typecheck
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: pnpm format
      - run: pnpm knip
      # A patch that no longer applies to the Next.js being released against is a Function that runs
      # without a rewrite it needs, and the adapter's own build says nothing about it. Cheap, and here
      # rather than only in CI: a tag can be pushed before that run finishes, or after it is cancelled.
      - run: pnpm check:patches
      - run: pnpm build

      - name: Publish
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # A prerelease must not become what `npm install` picks by default.
          case "${version}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          # `--access public`: a scoped package is restricted until it is said otherwise, and the
          # first publish of each is the one that decides.
          # `--provenance`: not left to the registry's own generation, so that a release that cannot
          # attest to itself fails here rather than landing unattested.
          # `--no-git-checks`: the tree is a tag, checked out detached, which those checks refuse.
          # `--ignore-scripts`: `pnpm build` above already ran what `prepack` would run — they are the
          # same command in every package that has one — so the only thing publishing them again would
          # add is package code running in a job that holds an `id-token`. The hook stays for whoever
          # packs by hand, where it is the safety net it was added to be.
          # No `--batch`: provenance is bound to one package, and a batch sends them together.
          set -- --access public --provenance --tag "${dist_tag}" --no-git-checks --ignore-scripts
          if [ "${DRY_RUN}" = true ]; then
            set -- "$@" --dry-run
          fi
          pnpm --recursive publish "$@"

  provenance:
    needs: publish
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    # Five packages, each given the ten minutes the comment below explains, and room to say so. The
    # read-back is serial, so this has to grow with the number of packages or a release that published
    # cleanly would be killed while verifying the last one — and the hundred `npm view` calls and the
    # checkout are on top of the fifty minutes the waiting alone can take.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      # For `npm` to be a version that reads a field out of a packument by name.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Read back rather than assumed: `--provenance` fails a publish that cannot attest, and this
      # says the attestation is also what the registry will hand an installer.
      - name: The registry holds a provenance attestation for every version published
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./${manifest}').private === true")" = true ]; then
              continue
            fi
            name="$(node -p "require('./${manifest}').name")"
            predicate=''
            # Give the registry time to agree with itself. It needs more than it sounds like: on the
            # first release, two of the three packages then published were readable at once and the third answered
            # 404 for its whole document for nine minutes — while its attestation endpoint was
            # already serving. So this waits ten, and the failure below means what it says.
            for _ in $(seq 20); do
              # `--prefer-online`: a cached packument from before the publish would read as a
              # release with no attestation, which is the one wrong answer this must not give.
              predicate="$(npm view --prefer-online "${name}@${version}" dist.attestations.provenance.predicateType 2>/dev/null || true)"
              if [ -n "${predicate}" ]; then
                break
              fi
              sleep 30
            done
            if [ -z "${predicate}" ]; then
              echo "::error::${name}@${version} has no provenance attestation"
              exit 1
            fi
            echo "${name}@${version}: ${predicate}"
          done

  draft:
    needs: provenance
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The one job here that writes anything. What it writes is a draft: a release nobody has
      # published yet, which is the only kind this repository can still change its mind about.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Releases are immutable here: once one is published, its notes and its files are what they
      # are. So a release this workflow left half-made must never be published by accident, and a
      # release a person did publish must never be touched — the two cases are the two branches.
      - name: Nothing has published a release for this tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          state="$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          case "${state}" in
            true)
              # An earlier attempt at this same release. A draft holds nothing anyone can have read,
              # so it is replaced rather than added to, and the tag it names is left alone.
              echo "::notice::replacing the draft an earlier run left for ${TAG}"
              gh release delete "${TAG}" --yes
              ;;
            false)
              echo "::error::${TAG} already has a *published* release, which immutability makes unchangeable"
              exit 1
              ;;
          esac

      # The files attached are the ones npm is serving, fetched back and checked against the digest
      # npm publishes beside them — not a second packing of the same tree, which would be a different
      # file that only ought to be the same.
      - name: Collect the tarballs npm is serving
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          rm -rf "${RUNNER_TEMP}/assets" && mkdir -p "${RUNNER_TEMP}/assets"
          : > "${RUNNER_TEMP}/packages.tsv"
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./${manifest}').private === true")" = true ]; then
              continue
            fi
            name="$(node -p "require('./${manifest}').name")"
            curl -fsSL "https://registry.npmjs.org/${name/\//%2f}" -o "${RUNNER_TEMP}/packument.json"
            # One line, three fields: where the tarball is, the digest npm published beside it, and
            # what the attestation says it is. Read with `cut` rather than a heredoc, which inside a
            # YAML block would depend on its own indentation surviving every future edit of this file.
            meta="$(python3 -c "
          import json, sys
          dist = json.load(open(sys.argv[1]))['versions'][sys.argv[2]]['dist']
          print(
              dist['tarball'],
              dist.get('integrity', '-'),
              dist.get('attestations', {}).get('provenance', {}).get('predicateType', '-'),
          )
          " "${RUNNER_TEMP}/packument.json" "${version}")"
            url="$(printf '%s' "${meta}" | cut -d' ' -f1)"
            integrity="$(printf '%s' "${meta}" | cut -d' ' -f2)"
            predicate="$(printf '%s' "${meta}" | cut -d' ' -f3)"
            file="${RUNNER_TEMP}/assets/$(basename "${url}")"
            # A scoped and an unscoped package can share a tarball basename, and the second download
            # would quietly replace the first. Say so instead.
            if [ -e "${file}" ]; then
              echo "::error::${name}@${version} would overwrite $(basename "${file}"), already collected"
              exit 1
            fi
            curl -fsSL "${url}" -o "${file}"
            if [ "${integrity}" != - ]; then
              got="sha512-$(openssl dgst -sha512 -binary "${file}" | base64 -w0)"
              if [ "${got}" != "${integrity}" ]; then
                echo "::error::${name}@${version}: the tarball npm served does not match the digest npm published"
                exit 1
              fi
            fi
            printf '%s\t%s\t%s\n' "${name}" "${version}" "${predicate}" >> "${RUNNER_TEMP}/packages.tsv"
            echo "${name}@${version}: $(basename "${file}") matches ${integrity}"
          done

      - name: Draft the release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="${RUNNER_TEMP}/notes.md"
          {
            echo '## Packages'
            echo
            echo 'Published to npm, each with a provenance attestation the release verified before this'
            echo 'draft was made. The files below are the tarballs npm is serving.'
            echo
            while IFS=$'\t' read -r name pkg_version predicate; do
              printf -- '- [`%s@%s`](https://www.npmjs.com/package/%s/v/%s) — `%s`\n' \
                "${name}" "${pkg_version}" "${name}" "${pkg_version}" "${predicate}"
            done < "${RUNNER_TEMP}/packages.tsv"
            echo
            # GitHub's own changelog, asked for rather than left to `--generate-notes`, so that it
            # goes *below* what this release is and the whole body is settled before a person looks.
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" --jq .body
          } > "${notes}"

          set -- "${TAG}" "${RUNNER_TEMP}"/assets/*.tgz
          set -- "$@" --draft --verify-tag --title "${TAG}" --notes-file "${notes}"
          case "${version}" in
            *-*) set -- "$@" --prerelease ;;
          esac
          gh release create "$@"
          echo "::notice::a draft release for ${TAG} is ready; publishing it is a person's job"
