packages:
  - packages/*
  - tools/*

# `fixtures/*` are deliberately not workspace packages. Each is an application the matrix builds
# with a Next.js of its own choosing, and a workspace package would be pinned to the catalog's —
# the one version the matrix exists to look past.

# Every shared version is pinned exactly once here; workspace packages reference "catalog:".
#
# `next` and `@next/routing` are pinned to the top of the range the adapter supports, not to its
# floor: this is the version the repository builds and typechecks against.
# `SUPPORTED_NEXT_RANGE` (`packages/adapter/src/patches/versions.ts`) is the range itself, and
# `packages/adapter/scripts/check-patches.ts` is what holds every release in it to the patches.
catalog:
  # Cloudflare's own types for the storage objects `@stayingupwind/sdk` hands an application. They
  # are in that package's public declarations, so they are a dependency of it and not a dev one.
  '@cloudflare/workers-types': 5.20261016.1
  '@eslint/js': 10.0.1
  # What the adapter reads a build's source maps with: `sourcemap-codec` for a map's mappings as
  # numbers and back (`projectOnly`), `trace-mapping` for the index maps Turbopack writes when debug
  # IDs are on, which a bundler does not compose through until they are one list (`flattened`).
  '@jridgewell/sourcemap-codec': 1.6.0
  '@jridgewell/trace-mapping': 0.3.31
  '@next/routing': 16.4.3
  # The AST Rolldown's `this.parse` hands a plugin: the version Rolldown itself depends on.
  '@oxc-project/types': 0.154.0
  '@types/node': 24.19.2
  # What `@stayingupwind/auth` wraps. A peer dependency there, so a project brings its own copy and
  # this pin is what the repository builds and typechecks against — the same arrangement as `next`.
  better-auth: 1.7.10
  eslint: 10.13.0
  eslint-config-prettier: 10.1.8
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-import-x: 4.17.1
  eslint-plugin-n: 18.5.0
  eslint-plugin-perfectionist: 5.12.1
  eslint-plugin-promise: 7.3.0
  # `recheck`, which decides a regular expression's worst case rather than guessing at its shape.
  # It is here because the cheaper checks miss what CodeQL's `js/polynomial-redos` reports: a
  # pattern whose match attempt is linear but is attempted from every position in the subject is
  # quadratic, and neither `regexp/no-super-linear-backtracking` nor `no-super-linear-move` says so.
  eslint-plugin-redos: 4.5.0
  eslint-plugin-regexp: 3.3.1
  eslint-plugin-security: 4.2.0
  eslint-plugin-sonarjs: 4.2.2
  eslint-plugin-unicorn: 78.0.0
  globals: 17.13.0
  # Reads a project's own config at build time, the way wrangler reads its own. Build-time only:
  # nothing of it reaches a Function.
  jsonc-parser: 3.3.1
  knip: 6.41.0
  # The workerd `upwind dev` and `upwind build` bind a project's local storage to. Follow the
  # registry's `beta` channel for v5: `latest` still names v4, whose workerd is from July and older
  # than the compatibility date a Function is built against (`FUNCTION_COMPATIBILITY_DATE` in
  # `@stayingupwind/adapter`). Keep this aligned with the version Wrangler uses.
  miniflare: 5.20261012.1-beta
  next: 16.4.3
  oxfmt: 0.73.0
  rolldown: 1.2.14
  # The Public Suffix List, by which `local:check` refuses a cookie for a domain no site holds.
  tldts: 7.4.18
  wrangler: 4.151.1
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  # The suites of the packages that have them, run by one root runner (`vitest.config.ts`), and the
  # lint rules they are held to beside the rest.
  vitest: 5.0.5
  '@vitest/eslint-plugin': 1.6.27
  # What `@stayingupwind/host` writes the cache's control contract in, and turns core's schemas into
  # where something takes zod's alone (`./zod`). What the runtime and the edge read — the gateway's
  # contract, the cache's records — is written with core's own validator instead, which is cheap to
  # build in an isolate that builds it before its first request.
  zod: 4.6.7
  # What `@stayingupwind/cache`'s gateway routes a Function's requests with.
  hono: 4.13.13
  # Runs `@stayingupwind/cache`'s suites inside workerd, with its own pinned Wrangler and
  # Miniflare, independently of the top-level development runtime.
  '@cloudflare/vitest-plugin': 1.4.0

# Only these dependencies may run install scripts.
allowBuilds:
  # Wrangler and Cloudflare's Vitest plugin still use this internally; upwind uses Rolldown.
  esbuild: true
  unrs-resolver: false
  # `false`, and not for want of trying it: `miniflare` requires the `workerd` package, whose main
  # module resolves the binary out of the platform package for this machine when it is loaded
  # (`generateBinPath`). The install script only copies that binary to `workerd/bin`, for a command
  # nothing here runs — and a project that installs `upwind` gets the same answer, which is why one
  # does not have to approve a build script to have local storage.
  workerd: false

strictPeerDependencies: true

# Security fixes within the versions already used by Miniflare, Next.js and build tooling:
# undici's HTTP client advisories (7.29.1), sharp's librsvg CVE-2026-96889 (0.35.5), and
# source-map-js's indexed-map denial of service CVE-2026-93749 (1.2.2). Keep the parent releases
# pinned; these dependencies do not run on a deployed Function's request path.
# Zod v4's bounded collection validation is patched for CVE-2023-54404 in 4.6.6.
overrides:
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'zod@>=4.0.0 <4.6.6': 4.6.7

# pnpm runs an implicit install before every `pnpm run` by default, and that install takes no lock
# (pnpm/pnpm#14551), so a second checkout running a script at the same time races it over
# `node_modules/.pnpm`. Nothing may install behind your back.
verifyDepsBeforeRun: false

# Supply-chain cooldown (pnpm default is 1 day; explicit so the policy is visible and strict).
minimumReleaseAge: 1440
# The cooldown exists so a compromised release is caught by somebody else first. A security
# release is the one case where waiting is the larger risk: the fix is public and so is what it
# fixes. Next.js is exempt for that reason and for no other.
minimumReleaseAgeExclude:
  - next
  - '@next/*'
